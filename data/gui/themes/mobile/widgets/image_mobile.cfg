#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-01): image definitions for phones.
###

# The game logo is 600x200; on a 540-wide portrait screen it must shrink.
# This definition caps the widget at 480x160 (same 3:1 shape) and scales the
# image to fit, so the logo never pushes the layout wider than the screen.
[image_definition]
	id = "mobile_logo"
	description = "The game logo, scaled down to fit a phone screen."

	[resolution]
		min_width = 0
		min_height = 0

		default_width = 0
		default_height = 0

		max_width = 480
		max_height = 160

		[state_enabled]
			[draw]
				[image]
					name = "(text)"
					x = 0
					y = 0
					w = "(width)"
					h = "(height)"
					resize_mode = "scale"
				[/image]
			[/draw]
		[/state_enabled]
	[/resolution]
[/image_definition]
