[window]
	id = "wml_message_left"
	description = "Dialog showing a unit portrait on the left side (Wesnoth Mobile)."

	# Portrait (base resolution)
	[resolution]
		definition = "mobile_wml_message_left_portrait"
		automatic_placement = false
		x = "(gamemap_x_offset)"
		y = "(floor(screen_height * 0.26))"
		width = "(gamemap_width)"
		height = "(screen_height - floor(screen_height * 0.26))"
		click_dismiss = true

		[linked_group]
			id = "icon"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "label"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "description"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				[column]
					vertical_alignment = "bottom"
					horizontal_grow = true

					[panel]
						definition = "wml_message"
						[grid]
							[row]
									[column]
										[spacer]
													id = "image_place_holder"
													width = "{_MOBILE_P1_BOX_W}"
													height = "({_MOBILE_P1_BOX_H} + 16)"
												[/spacer]
									[/column]
								[/row]
							[row]
								{_MOBILE_WML_MESSAGE_CONTENT}
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
		[/grid]
	[/resolution]

	# Landscape (800x400 and up)
	[resolution]
		window_width = 800
		window_height = 400
		definition = "mobile_wml_message_left_landscape"
		automatic_placement = false
		x = "(gamemap_x_offset)"
		y = 30
		width = "(gamemap_width)"
		height = "(screen_height - 30)"
		click_dismiss = true

		[linked_group]
			id = "icon"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "label"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "description"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				[column]
					vertical_alignment = "bottom"
					horizontal_grow = true

					[panel]
						definition = "wml_message"
						[grid]
							[row]
								[column]
									horizontal_grow = true
									[grid]
										[row]
											[column]
												[spacer]
													id = "image_place_holder"
													width = "{_MOBILE_L1_BOX_W}"
													height = "75"
												[/spacer]
											[/column]
											{_MOBILE_WML_MESSAGE_CONTENT}
											[column]
												[spacer]
													width = "(if(gamemap_width - ({_MOBILE_L1_BOX_W}) > 675, gamemap_width - (({_MOBILE_L1_BOX_W}) + 675), 0))"
													height = 75
												[/spacer]
											[/column]
										[/row]
									[/grid]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]

