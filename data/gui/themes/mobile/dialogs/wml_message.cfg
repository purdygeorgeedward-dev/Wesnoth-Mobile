#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): in-game character dialogue (portrait message boxes) for phones.
###
### Windows replaced: wml_message_left, wml_message_right, wml_message_double.
### Each has a landscape layout (window 800x400 and up, about 1170x540) and a portrait layout
### (base resolution, about 540x1170).
###
### Why the portrait sizing is different from the default theme:
###   The default theme scales a portrait by (width / 500), assuming stock portraits of about 400 px.
###   George's replacement portraits are about 1000 to 1500 px, which would draw far too large.
###   Here each portrait is fitted (aspect ratio kept) into a fixed box. The dialog itself cannot
###   know the image size, so it reserves the box, and the window definition draws the image
###   inside that box using image_original_width and image_original_height.
###
###   Landscape: the portrait box is at the bottom-left or bottom-right, text fills the rest
###              (at most 675 wide, as in the default theme).
###   Portrait:  the window fills the lower 74% of the screen. A box for the portrait(s) is on top
###              inside the text panel, and the message, input list and OK button are underneath.
###
### Box sizes in logical pixels on the A26 (1170x540 landscape, 540x1170 portrait):
###   landscape one portrait: 34% of the game width by 88% of the window height (about 398x448)
###   landscape two portraits: 27% of the game width each (about 316 wide)
###   portrait one portrait: 62% of the game width by 38% of the screen height (about 335x445)
###   portrait two portraits: 46% of the game width each by 30% of the screen height
###
### Widget ids are the ones src/gui/dialogs/wml_message.cpp looks up (title, message, input_caption,
### input, input_list with icon/label/description, ok). The message and input widgets are copies
### of the default theme's, with 10 px borders instead of 5.
###


# Fit the portrait into a box (BOX_W x BOX_H), keeping its aspect ratio.
# SCALE is 0 when there is no image (image_original_* are not positive).
#define _MOBILE_PORTRAIT_SCALE BOX_W BOX_H
(if(image_original_width > 0 and image_original_height > 0, min(as_decimal({BOX_W}) / image_original_width, as_decimal({BOX_H}) / image_original_height), 0))#enddef

#define _MOBILE_PORTRAIT_W BOX_W BOX_H
(image_original_width * {_MOBILE_PORTRAIT_SCALE ({BOX_W}) ({BOX_H})})#enddef

#define _MOBILE_PORTRAIT_H BOX_W BOX_H
(image_original_height * {_MOBILE_PORTRAIT_SCALE ({BOX_W}) ({BOX_H})})#enddef

# Box sizes (shared by the window definitions and the dialogs).
#define _MOBILE_L1_BOX_W
floor(gamemap_width * 0.34)#enddef
#define _MOBILE_L1_BOX_H
floor((screen_height - 30) * 0.88)#enddef
#define _MOBILE_L2_BOX_W
floor(gamemap_width * 0.27)#enddef
#define _MOBILE_P1_BOX_W
floor(gamemap_width * 0.62)#enddef
#define _MOBILE_P1_BOX_H
floor(screen_height * 0.38)#enddef
#define _MOBILE_P2_BOX_W
floor(gamemap_width * 0.46)#enddef
#define _MOBILE_P2_BOX_H
floor(screen_height * 0.30)#enddef

#define _MOBILE_WML_INPUT_LIST
[listbox]
	id = "input_list"
	definition = "wml_message"
	[list_definition]

		[row]

			[column]
				grow_factor = 1
				horizontal_grow = true

				[toggle_panel]
					definition = "wml_message"

					return_value_id = "ok"
					[grid]

						[row]

							[column]
								grow_factor = 0
								horizontal_alignment = "left"

								border = "all"
								border_size = 10

								[image]
									id = "icon"
									definition = "default"
									linked_group = "icon"
								[/image]

							[/column]

							[column]
								grow_factor = 0
								horizontal_alignment = "left"

								border = "all"
								border_size = 10

								[label]
									id = "label"
									definition = "default"
									linked_group = "label"
								[/label]

							[/column]

							[column]
								grow_factor = 1
								horizontal_grow = true

								border = "all"
								border_size = 10

								[label]
									id = "description"
									definition = "default"
									linked_group = "description"
								[/label]

							[/column]

						[/row]

					[/grid]

				[/toggle_panel]

			[/column]

		[/row]

	[/list_definition]

[/listbox]
#enddef

#define _MOBILE_WML_MESSAGE_CONTENT
[column]
	grow_factor = 1
	horizontal_grow = true
	vertical_grow = true

	[grid]

		[row]
			grow_factor = 0

			[column]
				border = "all"
				border_size = 10
				horizontal_alignment = "left"

				[label]
					id = "title"
					definition = "title"
				[/label]

			[/column]

		[/row]

		[row]
			grow_factor = 1

			[column]
				grow_factor = 1
				horizontal_grow = true

				border = "all"
				border_size = 10

				[scroll_label]
					id = "message"
					definition = "wml_message"
				[/scroll_label]

			[/column]

		[/row]

		[row]
			grow_factor = 0

			[column]
				grow_factor = 1
				horizontal_grow = true

				[grid]

					[row]

						[column]
							border = "all"
							border_size = 10

							[label]
								id = "input_caption"
								definition = "default"
							[/label]

						[/column]

						[column]
							grow_factor = 1
							horizontal_grow = true

							border = "all"
							border_size = 10

							[text_box]
								id = "input"
								definition = "transparent"
							[/text_box]

						[/column]

					[/row]

				[/grid]

			[/column]

		[/row]

		[row]
			grow_factor = 0

			[column]
				border = "all"
				border_size = 10
				horizontal_grow = true

				{_MOBILE_WML_INPUT_LIST}

			[/column]

		[/row]

		[row]
			grow_factor = 0

			[column]
				border = "all"
				border_size = 10
				horizontal_alignment = "center"

				[button]
					# This button will be shown or hidden depending on the
					# whether or not a scrollbar is needed to show the
					# text.
					id = "ok"
					definition = "transparent"

					label = _ "OK"
				[/button]

			[/column]

		[/row]

	[/grid]

[/column]
#enddef

[window_definition]
	id = "mobile_wml_message_left_landscape"
	description = "Wesnoth Mobile portrait window."
	[resolution]
		[background]
			[draw]
			[/draw]
		[/background]
		[foreground]
			[draw]
				[image]
					x = "(({_MOBILE_L1_BOX_W}) - {_MOBILE_PORTRAIT_W ({_MOBILE_L1_BOX_W}) ({_MOBILE_L1_BOX_H})}) / 2"
					y = "(height - {_MOBILE_PORTRAIT_H ({_MOBILE_L1_BOX_W}) ({_MOBILE_L1_BOX_H})})"
					w = "{_MOBILE_PORTRAIT_W ({_MOBILE_L1_BOX_W}) ({_MOBILE_L1_BOX_H})}"
					h = "{_MOBILE_PORTRAIT_H ({_MOBILE_L1_BOX_W}) ({_MOBILE_L1_BOX_H})}"
					name = "(portrait_image)"
					mirror = "(portrait_mirror)"
				[/image]
			[/draw]
		[/foreground]
	[/resolution]
[/window_definition]

