#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): save game dialog for phones.
###
### The dialog is just a file name box with Save and Cancel. On a phone the on-screen
### keyboard covers the lower half of the screen, so the window is placed at the TOP
### of the screen (the default theme centers it, which puts the name box under the keyboard).
###   - portrait  (base resolution, about 540x1170): nearly full width, Save and Cancel as
###     two equal full-width buttons side by side.
###   - landscape (window 800x400 and up, about 1170x540): up to 900 wide, buttons at the right.
### Widget ids match what src/gui/dialogs/game_save.cpp binds: txtFilename, ok, cancel
### (lblTitle is only a label). Borders are 10 px instead of 5.
###

#define _MOBILE_SAVE_TITLE
	[label]
		id = "lblTitle"
		definition = "title"
		label = _ "Save Game"
	[/label]
#enddef

#define _MOBILE_SAVE_NAME_ROW
	[grid]
		[row]
			grow_factor = 1
			[column]
				grow_factor = 0
				border = "all"
				border_size = 10
				horizontal_alignment = "left"

				[label]
					definition = "default"
					label = _ "Name:"
				[/label]
			[/column]

			[column]
				grow_factor = 1
				border = "all"
				border_size = 10
				horizontal_grow = true

				[text_box]
					id = "txtFilename"
					definition = "default"
					max_input_length = "127"
				[/text_box]
			[/column]
		[/row]
	[/grid]
#enddef

#define _MOBILE_SAVE_BTN_OK
	[button]
		id = "ok"
		definition = "default"
		label = _ "Save"
	[/button]
#enddef

#define _MOBILE_SAVE_BTN_CANCEL
	[button]
		id = "cancel"
		definition = "default"
		label = _ "Cancel"
	[/button]
#enddef

[window]
	id = "game_save"
	description = "Save game dialog (Wesnoth Mobile)."

	# Portrait (base resolution)
	[resolution]
		definition = "default"
		automatic_placement = true
		vertical_placement = "top"
		horizontal_placement = "center"
		maximum_width = "(screen_width - 20)"

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0
				[column]
					grow_factor = 1
					border = "all"
					border_size = 10
					horizontal_alignment = "left"

					{_MOBILE_SAVE_TITLE}
				[/column]
			[/row]

			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true

					{_MOBILE_SAVE_NAME_ROW}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_SAVE_BTN_OK}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_SAVE_BTN_CANCEL}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]

	# Landscape (800x400 and up)
	[resolution]
		window_width = 800
		window_height = 400
		definition = "default"
		automatic_placement = true
		vertical_placement = "top"
		horizontal_placement = "center"
		maximum_width = "(min(screen_width - 40, 900))"

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0
				[column]
					grow_factor = 1
					border = "all"
					border_size = 10
					horizontal_alignment = "left"

					{_MOBILE_SAVE_TITLE}
				[/column]
			[/row]

			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true

					{_MOBILE_SAVE_NAME_ROW}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_alignment = "right"

					[grid]
						[row]
							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "right"

								{_MOBILE_SAVE_BTN_OK}
							[/column]
							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "right"

								{_MOBILE_SAVE_BTN_CANCEL}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]

[/window]
