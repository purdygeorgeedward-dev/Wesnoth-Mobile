#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): in-game transient message dialog for phones.
### This is the dialog that shows the scenario objectives (play_controller::show_objectives)
### and many short in-game notices. It has no buttons: a tap anywhere closes it.
###
### Differences from the default theme:
###   - it is as wide as the screen allows (screen width minus 20, at most 900) instead of
###     a fixed 800 cap, so on the narrow portrait screen the text uses the full width;
###   - 10 px borders instead of 5 around the text;
###   - the text can never be taller than the screen (maximum_height).
### Widget ids match src/gui/dialogs/transient_message.cpp: title, message, image.
### "message" must stay a label (the engine registers it as a label), so a very long
### message is cut off at the bottom rather than scrolled.
###

#define _MOBILE_TRANSIENT_CONTENT
		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				[column]
					vertical_alignment = "top"
					border = "all"
					border_size = 10

					[image]
						id = "image"
						definition = "default"
					[/image]
				[/column]

				[column]
					grow_factor = 1
					vertical_alignment = "top"
					horizontal_alignment = "left"

					[grid]
						[row]
							[column]
								border = "all"
								border_size = 10
								vertical_alignment = "top"
								horizontal_alignment = "left"

								[label]
									id = "title"
									definition = "title"
								[/label]
							[/column]
						[/row]

						[row]
							[column]
								border = "all"
								border_size = 10
								vertical_alignment = "top"
								horizontal_alignment = "left"

								[label]
									id = "message"
									definition = "wml_message"
									wrap = true
								[/label]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
#enddef

[window]
	id = "transient_message"
	description = "A transient message on a semi-transparent dialog (Wesnoth Mobile)."

	# Portrait (base resolution)
	[resolution]
		definition = "message"
		click_dismiss = true
		maximum_width = "(screen_width - 20)"
		maximum_height = "(screen_height - 40)"

		{_MOBILE_TRANSIENT_CONTENT}
	[/resolution]

	# Landscape (800x400 and up)
	[resolution]
		window_width = 800
		window_height = 400
		definition = "message"
		click_dismiss = true
		maximum_width = "(min(screen_width - 40, 900))"
		maximum_height = "(screen_height - 40)"

		{_MOBILE_TRANSIENT_CONTENT}
	[/resolution]

[/window]
