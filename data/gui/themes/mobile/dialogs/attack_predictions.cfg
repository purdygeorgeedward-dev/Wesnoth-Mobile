#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): attack damage calculations (prediction) dialog for phones.
###
### The attacker and defender data columns (names, resistances, damage, HP graph) are tall, and
### the default window is centered and sized to its content, so it is taller than a 540 tall
### landscape screen. Here:
###   - the window fills the screen in both orientations;
###   - the two data columns are inside a scrollbar_panel, so they scroll when they do not fit;
###   - landscape (window 800x400 and up, about 1170x540): attacker and defender side by side as
###     in the default theme;
###   - portrait (base resolution, about 540x1170): attacker above defender, because two columns
###     side by side would each get only about 250 pixels of width;
###   - Close is a full-width button in portrait and stays at the right in landscape.
### The macros that build the columns are copied unchanged from the default theme (it removes
### them again at its end, as this file does). Widget ids are unchanged (title, cancel and the
### ids the engine fills through the prefixed data rows).
###

###
### Definition of the window to display various possible attack results
###

#define _GUI_SPACER_ROW
	[row]
		grow_factor = 0

		[column]
			[spacer]
				height = 15
			[/spacer]
		[/column]

	[/row]
#enddef

#define _GUI_DOUBLE_SPACER_ROW
	[row]
		grow_factor = 0

		[column]
			[spacer]
				height = 15
			[/spacer]
		[/column]

		[column]
			[spacer]
				height = 15
			[/spacer]
		[/column]

	[/row]
#enddef

#define _GUI_DATA_ROW _ID_PREFIX _ID _LABEL

#arg _DEFINITON
"default_small"#endarg

#arg _GROW_FACTOR
0#endarg

	[row]
		grow_factor = {_GROW_FACTOR}

		[column]
			border = "left,right,top"
			border_size = 5
			horizontal_alignment = "left"

			[label]
# wmllint: markcheck off
				id = {_ID_PREFIX} + "_" + {_ID} + "_label"
# wmllint: markcheck on
				definition = {_DEFINITON}

				label = {_LABEL}

				use_markup = true
			[/label]
		[/column]

		[column]
			border = "left,right,top"
			border_size = 5
			horizontal_alignment = "left"

			[label]
# wmllint: markcheck off
				id = {_ID_PREFIX} + "_" + {_ID}
# wmllint: markcheck on
				definition = "default_small"

				use_markup = true
			[/label]
		[/column]

	[/row]
#enddef

#define _GUI_DATA_PANEL _ID_PREFIX
	[grid]
		{_GUI_DATA_ROW ({_ID_PREFIX}) "base_damage"         ( _ "Base damage")}
		{_GUI_DATA_ROW ({_ID_PREFIX}) "resis"               ()}
		{_GUI_DATA_ROW ({_ID_PREFIX}) "tod_modifier"        ( _ "Time of day modifier")}
		{_GUI_DATA_ROW ({_ID_PREFIX}) "leadership_modifier" ( _ "Leadership bonus")}
		{_GUI_DATA_ROW ({_ID_PREFIX}) "slowed_modifier"     ( _ "Slowed penalty") _GROW_FACTOR=1}

		{_GUI_DOUBLE_SPACER_ROW}

		{_GUI_DATA_ROW ({_ID_PREFIX}) "total_damage" ("<b>" + _ "Total damage" + "</b>") _DEFINITON="default"}

		{_GUI_DOUBLE_SPACER_ROW}

		{_GUI_DATA_ROW ({_ID_PREFIX}) "chance_to_hit"    ( _ "Chance to hit")}
		{_GUI_DATA_ROW ({_ID_PREFIX}) "chance_unscathed" ( _ "Chance of being unscathed")}
	[/grid]
#enddef

#define _GUI_HP_GRAPH _ID_PREFIX
	[drawing]
		id = {_ID_PREFIX} + "_hp_graph"
		definition = "default"

		width = 270
		height = 170

		[draw]

			[rectangle]
				x = 0
				y = 0
				w = "(width)"
				h = "(height)"
				fill_color = {GUI__BACKGROUND_COLOR_DISABLED}
				border_thickness = 2
				border_color = {GUI__FONT_COLOR_DISABLED__DEFAULT}
			[/rectangle]

			[rectangle]
				x = "(hp_column_width)"
				y = 0
				w = 2
				h = "(height - 2)"
				fill_color = {GUI__FONT_COLOR_DISABLED__DEFAULT}
			[/rectangle]

			[rectangle]
				x = "(width - chance_column_width - 2)"
				y = 0
				w = 2
				h = "(height - 2)"
				fill_color = {GUI__FONT_COLOR_DISABLED__DEFAULT}
			[/rectangle]

		[/draw]

	[/drawing]
#enddef

#define _GUI_DATA_COLUMN _HEADER _ID_PREFIX
	[grid]
		linked_group = "main_column"

		[row]
			grow_factor = 0

			[column]
				border = "all"
				border_size = 5
				horizontal_alignment = "center"

				[label]
					label = {_HEADER}
					definition = "default_large"
				[/label]
			[/column]

		[/row]

		[row]
			grow_factor = 1

			[column]
				horizontal_grow = true
				vertical_grow = true

				{_GUI_DATA_PANEL ({_ID_PREFIX})}
			[/column]

		[/row]

		{_GUI_SPACER_ROW}

		[row]
			grow_factor = 0

			[column]
				border = "all"
				border_size = 5
				horizontal_alignment = "center"

				[label]
					definition = "default_small"
					label = _ "Expected Battle Result (HP)"
				[/label]
			[/column]

		[/row]

		[row]
			grow_factor = 0

			[column]
				border = "all"
				border_size = 5
				horizontal_alignment = "center"

				{_GUI_HP_GRAPH ({_ID_PREFIX})}
			[/column]

		[/row]

	[/grid]
#enddef

[window]
	id = "attack_predictions"
	description = "Damage calculations dialog (Wesnoth Mobile)."

	# Portrait (base resolution)
	[resolution]
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		[linked_group]
			id = "main_column"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0
				[column]
					grow_factor = 1
					border = "all"
					border_size = 10
					horizontal_alignment = "left"

					[label]
						id = "title"
						definition = "title"
						label = _ "Damage Calculations"
					[/label]
				[/column]
			[/row]

			# The columns scroll when they do not fit.
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[scrollbar_panel]
						[definition]
							[row]
								[column]
									grow_factor = 1
									horizontal_grow = true
									vertical_grow = true

									[grid]
						[row]
							[column]
								grow_factor = 1
								horizontal_grow = true
								vertical_grow = true
								{_GUI_DATA_COLUMN ( _ "Attacker") ("attacker")}
							[/column]
						[/row]
						{GUI_HORIZONTAL_SPACER_LINE}
						[row]
							[column]
								grow_factor = 1
								horizontal_grow = true
								vertical_grow = true
								{_GUI_DATA_COLUMN ( _ "Defender") ("defender")}
							[/column]
						[/row]
					[/grid]
								[/column]
							[/row]
						[/definition]
					[/scrollbar_panel]
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					border = "all"
					border_size = 10
					horizontal_grow = true
					[button]
						id = "cancel"
						label = _ "Close"
					[/button]
				[/column]
			[/row]
		[/grid]
	[/resolution]

	# Landscape (800x400 and up)
	[resolution]
		window_width = 800
		window_height = 400
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		[linked_group]
			id = "main_column"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0
				[column]
					grow_factor = 1
					border = "all"
					border_size = 10
					horizontal_alignment = "left"

					[label]
						id = "title"
						definition = "title"
						label = _ "Damage Calculations"
					[/label]
				[/column]
			[/row]

			# The columns scroll when they do not fit.
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[scrollbar_panel]
						[definition]
							[row]
								[column]
									grow_factor = 1
									horizontal_grow = true
									vertical_grow = true

									[grid]
						[row]
							[column]
								grow_factor = 1
								horizontal_grow = true
								vertical_grow = true
								{_GUI_DATA_COLUMN ( _ "Attacker") ("attacker")}
							[/column]
							{GUI_VERTICAL_SPACER_LINE}
							[column]
								grow_factor = 1
								horizontal_grow = true
								vertical_grow = true
								{_GUI_DATA_COLUMN ( _ "Defender") ("defender")}
							[/column]
						[/row]
					[/grid]
								[/column]
							[/row]
						[/definition]
					[/scrollbar_panel]
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					border = "all"
					border_size = 10
					horizontal_alignment = "right"
					[button]
						id = "cancel"
						label = _ "Close"
					[/button]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]

#undef _GUI_SPACER_ROW
#undef _GUI_DOUBLE_SPACER_ROW
#undef _GUI_DATA_ROW
#undef _GUI_DATA_COLUMN
#undef _GUI_DATA_PANEL
#undef _GUI_HP_GRAPH
