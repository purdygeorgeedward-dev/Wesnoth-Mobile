#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): message / confirmation dialog for phones.
### Used for confirmations such as quit, overwrite save and end turn, and for
### notices with one to three buttons (left_side, ok, cancel, right_side are
### shown or hidden by src/gui/dialogs/message.cpp).
###
### Two layouts, picked by screen size (logical pixels, phone at pixel scale 2):
###   - portrait  (base resolution, about 540x1170): nearly full width, buttons stacked
###     one under another, each as wide as the dialog, so every choice is a big touch target.
###   - landscape (window 800x400 and up, about 1170x540): up to 900 wide, buttons in a
###     row at the right as in the default theme, with 10 px borders.
### Widget ids match message.cpp: title, image, label, left_side, ok, cancel, right_side.
###

#define _MOBILE_MESSAGE_TOP
		[grid]
			[row]
				[column]
					vertical_alignment = "top"
					border = "all"
					border_size = 10

					[image]
						id = "image"
						definition = "default"
					[/image]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_alignment = "top"
					horizontal_alignment = "left"

					[grid]
						[row]
							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "left"

								[label]
									id = "title"
									definition = "title"
								[/label]
							[/column]
						[/row]

						[row]
							grow_factor = 1
							[column]
								grow_factor = 1
								border = "all"
								border_size = 10
								horizontal_grow = true
								vertical_alignment = "top"
								horizontal_alignment = "left"

								[scroll_label]
									id = "label"
									definition = "default"
								[/scroll_label]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
#enddef

#define _MOBILE_MESSAGE_BUTTON ID LABEL
	[button]
		id = {ID}
		definition = "default"
		{LABEL}
	[/button]
#enddef

[window]
	id = "message"
	description = "Message dialog with up to four buttons (Wesnoth Mobile)."

	# Portrait (base resolution): buttons stacked, each the full width.
	[resolution]
		definition = "default"
		click_dismiss = true
		maximum_width = "(screen_width - 20)"
		maximum_height = "(screen_height - 40)"

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					{_MOBILE_MESSAGE_TOP}
				[/column]
			[/row]

			[row]
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 10

					{_MOBILE_MESSAGE_BUTTON "left_side" ()}
				[/column]
			[/row]

			[row]
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 10

					{_MOBILE_MESSAGE_BUTTON "ok" (label = _ "Close")}
				[/column]
			[/row]

			[row]
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 10

					{_MOBILE_MESSAGE_BUTTON "cancel" (label = _ "Cancel")}
				[/column]
			[/row]

			[row]
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 10

					{_MOBILE_MESSAGE_BUTTON "right_side" ()}
				[/column]
			[/row]
		[/grid]
	[/resolution]

	# Landscape (800x400 and up): one row of buttons at the right.
	[resolution]
		window_width = 800
		window_height = 400
		definition = "default"
		click_dismiss = true
		maximum_width = "(min(screen_width - 40, 900))"
		maximum_height = "(screen_height - 40)"

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					{_MOBILE_MESSAGE_TOP}
				[/column]
			[/row]

			[row]
				[column]
					horizontal_alignment = "right"

					[grid]
						[row]
							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "right"

								{_MOBILE_MESSAGE_BUTTON "left_side" ()}
							[/column]

							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "right"

								{_MOBILE_MESSAGE_BUTTON "ok" (label = _ "Close")}
							[/column]

							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "right"

								{_MOBILE_MESSAGE_BUTTON "cancel" (label = _ "Cancel")}
							[/column]

							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "right"

								{_MOBILE_MESSAGE_BUTTON "right_side" ()}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]

[/window]
