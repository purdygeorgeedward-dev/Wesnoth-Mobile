#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): unit advancement choice (level up) for phones.
### Shown whenever a unit levels up and has more than one advancement to choose from, which is
### common in campaigns.
###   - portrait  (base resolution, about 540x1170): fills the screen. The choice list is on top
###     (it takes the spare height) and the preview of the highlighted advancement is below it,
###     because side by side each would get only about 250 pixels.
###   - landscape (window 800x400 and up, about 1170x540): fills the screen with the default
###     arrangement: preview at the left, the question and the choice list at the right.
###     The default window can be up to 700 tall.
### OK is a full-width button in portrait. Widget ids match src/gui/dialogs/unit_advance.cpp:
### advance_choice (in the list), advancement_details, show_help, ok. The list is the default
### theme's with 9 px row padding instead of 5.
###

#define _MOBILE_ADVANCE_LIST
	[listbox]
		id = "advance_choice"
		definition = "default"

		[list_definition]
			[row]
				[column]
					vertical_grow = true
					horizontal_grow = true

					[toggle_panel]
						definition = "default"

						return_value_id = "ok"
						[grid]
							[row]
								[column]
									grow_factor = 0
									horizontal_grow = true
									border = "all"
									border_size = 9

									[image]
										id = "advancement_image"
										definition = "default"
										linked_group = "image"
									[/image]
								[/column]

								[column]
									grow_factor = 1
									border = "all"
									border_size = 9
									horizontal_alignment = "left"
									[label]
										id = "advancement_name"
										definition = "default"
										linked_group = "type"
										use_markup = true
									[/label]
								[/column]
							[/row]
						[/grid]
					[/toggle_panel]
				[/column]
			[/row]
		[/list_definition]
	[/listbox]
#enddef

#define _MOBILE_ADVANCE_TITLE
	[label]
		definition = "title"
		label = _ "Advance Unit"
	[/label]
#enddef

#define _MOBILE_ADVANCE_QUESTION
	[label]
		definition = "default"
		label = _ "What should our victorious unit become?"
	[/label]
#enddef

#define _MOBILE_ADVANCE_PREVIEW
	[unit_preview_pane]
		definition = "default"
		id = "advancement_details"
	[/unit_preview_pane]
#enddef

#define _MOBILE_ADVANCE_HELP
	[button]
		id = "show_help"
		definition = "help"
	[/button]
#enddef

#define _MOBILE_ADVANCE_OK
	[button]
		id = "ok"
		definition = "default"
		label = _ "OK"
	[/button]
#enddef

[window]
	id = "unit_advance"
	description = "Unit advancement dialog (Wesnoth Mobile)"

	# Portrait (base resolution)
	[resolution]
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		[linked_group]
			id = "image"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "type"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0
				[column]
					horizontal_alignment = "left"
					border = "all"
					border_size = 10

					{_MOBILE_ADVANCE_TITLE}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_alignment = "left"
					border = "all"
					border_size = 10

					{_MOBILE_ADVANCE_QUESTION}
				[/column]
			[/row]

			# The choice list takes all the spare height.
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true
					border = "all"
					border_size = 5

					{_MOBILE_ADVANCE_LIST}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 5

					{_MOBILE_ADVANCE_PREVIEW}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 0
								horizontal_alignment = "left"
								border = "all"
								border_size = 10

								{_MOBILE_ADVANCE_HELP}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_ADVANCE_OK}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]

	# Landscape (800x400 and up)
	[resolution]
		window_width = 800
		window_height = 400
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		[linked_group]
			id = "image"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "type"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0
				[column]
					horizontal_alignment = "left"
					border = "all"
					border_size = 5

					{_MOBILE_ADVANCE_TITLE}
				[/column]
			[/row]

			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 0
								vertical_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_ADVANCE_PREVIEW}
							[/column]

							[column]
								grow_factor = 1
								horizontal_grow = true
								vertical_grow = true
								border = "all"
								border_size = 5

								[grid]
									[row]
										grow_factor = 0
										[column]
											horizontal_alignment = "left"
											border = "all"
											border_size = 5

											{_MOBILE_ADVANCE_QUESTION}
										[/column]
									[/row]

									[row]
										grow_factor = 1
										[column]
											grow_factor = 1
											horizontal_grow = true
											vertical_grow = true

											{_MOBILE_ADVANCE_LIST}
										[/column]
									[/row]
								[/grid]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 1
								horizontal_alignment = "left"
								border = "all"
								border_size = 5

								{_MOBILE_ADVANCE_HELP}
							[/column]
							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								{_MOBILE_ADVANCE_OK}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]

[/window]
