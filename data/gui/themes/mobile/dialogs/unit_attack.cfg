#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): attack selection dialog for phones.
###
### Two layouts, picked by screen size (logical pixels, phone at pixel scale 2):
###   - portrait  (base resolution, about 540x1170): fills the screen. The attacker panel is
###     above the defender panel, the weapon list takes the spare height, and the buttons are
###     full-width rows: Attack, Cancel, Damage Calculation.
###   - landscape (window 800x400 and up, about 1170x540): fills the screen. Attacker and
###     defender panels side by side as in the default theme, weapon list under them,
###     and ONE row of buttons (Damage Calculation at the left, Attack and Cancel at the right)
###     so everything fits in 540 height.
### Widget ids match src/gui/dialogs/unit_attack.cpp: weapon_list (with attacker_weapon_icon,
### attacker_weapon, range, defender_weapon, defender_weapon_icon), attacker_pane, defender_pane,
### damage_calculation, ok, cancel. The weapon list is the default theme's with 8 px borders.
###

#define _MOBILE_ATTACK_WEAPONS
[grid]

	[row]

		[column]
			horizontal_grow = true
			border = "all"
			border_size = 8

			[listbox]
				id = "weapon_list"
				definition = "default"
				horizontal_scrollbar_mode = "never"

				[list_definition]

					[row]

						[column]
							vertical_grow = true
							horizontal_grow = true

							[toggle_panel]
								definition = "default"

								return_value_id = "ok"
								[grid]

									[row]
										grow_factor = 1

										[column]
											grow_factor = 0
											horizontal_alignment = "left"

											border = "all"
											border_size = 8

											[image]
												id = "attacker_weapon_icon"
												definition = "default"
											[/image]

										[/column]

										[column]
											grow_factor = 1
											horizontal_alignment = "left"
											vertical_alignment = "center"

											border = "all"
											border_size = 8

											[label]
												id = "attacker_weapon"
												definition = "default_small"
												linked_group = "weapon"
												characters_per_line = 25
											[/label]

										[/column]

										[column]
											grow_factor = 0
											horizontal_alignment = "center"
											vertical_alignment = "center"

											border = "all"
											border_size = 8

											[label]
												id = "range"
												definition = "default"

												text_alignment = "center"
											[/label]

										[/column]

										[column]
											grow_factor = 1
											horizontal_alignment = "right"
											vertical_alignment = "center"

											border = "all"
											border_size = 8

											[label]
												id = "defender_weapon"
												definition = "default_small"
												linked_group = "weapon"

												text_alignment = "right"
												characters_per_line = 25
											[/label]

										[/column]

										[column]
											grow_factor = 0
											horizontal_alignment = "right"
											border = "all"
											border_size = 8

											[image]
												id = "defender_weapon_icon"
												definition = "default"
											[/image]

										[/column]

									[/row]

								[/grid]

							[/toggle_panel]

						[/column]

					[/row]

				[/list_definition]

			[/listbox]

		[/column]

	[/row]

[/grid]
#enddef

#define _MOBILE_ATTACK_TITLE
	[label]
		definition = "title"
		label = _ "Attack Enemy"
	[/label]
#enddef

#define _MOBILE_ATTACK_ATTACKER
	[unit_preview_pane]
		id = "attacker_pane"
		definition = "unit_minimal_left"
	[/unit_preview_pane]
#enddef

#define _MOBILE_ATTACK_DEFENDER
	[unit_preview_pane]
		id = "defender_pane"
		definition = "unit_minimal_right"
		image_mods = "~FL(horiz)"
	[/unit_preview_pane]
#enddef

#define _MOBILE_ATTACK_BTN_DAMAGE
	[button]
		id = "damage_calculation"
		definition = "default"
		label = _ "Damage Calculation"
	[/button]
#enddef

#define _MOBILE_ATTACK_BTN_OK
	[button]
		id = "ok"
		definition = "default"
		label = _ "Attack"
	[/button]
#enddef

#define _MOBILE_ATTACK_BTN_CANCEL
	[button]
		id = "cancel"
		definition = "default"
		label = _ "Cancel"
	[/button]
#enddef

[window]
	id = "unit_attack"
	description = "Unit attack dialog (Wesnoth Mobile)."

	# Portrait (base resolution): panels stacked, buttons stacked.
	[resolution]
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		[linked_group]
			id = "unit"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "unit_image"
			fixed_height = true
		[/linked_group]

		[linked_group]
			id = "weapon"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip_transparent"
		[/tooltip]

		[helptip]
			id = "tooltip_transparent"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0
				[column]
					horizontal_alignment = "left"
					border = "all"
					border_size = 10

					{_MOBILE_ATTACK_TITLE}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 5

					{_MOBILE_ATTACK_ATTACKER}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 5

					{_MOBILE_ATTACK_DEFENDER}
				[/column]
			[/row]

			# The weapon list takes all the spare height.
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[grid]
						[row]
							grow_factor = 1
							[column]
								grow_factor = 1
								horizontal_grow = true
								vertical_grow = true

								{_MOBILE_ATTACK_WEAPONS}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_ATTACK_BTN_OK}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_ATTACK_BTN_CANCEL}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 10

					{_MOBILE_ATTACK_BTN_DAMAGE}
				[/column]
			[/row]
		[/grid]
	[/resolution]

	# Landscape (800x400 and up): panels side by side, one row of buttons.
	[resolution]
		window_width = 800
		window_height = 400
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		[linked_group]
			id = "unit"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "unit_image"
			fixed_height = true
		[/linked_group]

		[linked_group]
			id = "weapon"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip_transparent"
		[/tooltip]

		[helptip]
			id = "tooltip_transparent"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0
				[column]
					horizontal_alignment = "left"
					border = "all"
					border_size = 5

					{_MOBILE_ATTACK_TITLE}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_ATTACK_ATTACKER}
							[/column]

							{GUI_VERTICAL_SPACER_LINE}

							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_ATTACK_DEFENDER}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			# The weapon list takes all the spare height.
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[grid]
						[row]
							grow_factor = 1
							[column]
								grow_factor = 1
								horizontal_grow = true
								vertical_grow = true

								{_MOBILE_ATTACK_WEAPONS}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 1
								horizontal_alignment = "left"
								border = "all"
								border_size = 5

								{_MOBILE_ATTACK_BTN_DAMAGE}
							[/column]
							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								{_MOBILE_ATTACK_BTN_OK}
							[/column]
							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								{_MOBILE_ATTACK_BTN_CANCEL}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]

[/window]
