#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): help browser for phones.
###
### The default window is a fixed 1350x800 centered, which is bigger than a phone in both
### orientations (about 1170x540 landscape, 540x1170 portrait, in logical pixels).
###   - landscape (window 800x400 and up): fills the screen. Same arrangement as the default:
###     topic tree at the left, and at the right the title / contents / back / next / search row,
###     the scrollable text and the Close button.
###   - portrait (base resolution): fills the screen, everything stacked: the title / contents /
###     back / next / search row, the topic tree, the scrollable text, and Close as a full-width
###     button. The Contents toggle (id contents) hides the tree so the text gets the whole
###     screen: the engine toggles the tree panel when it is pressed.
### Widget ids are the default theme's (topic_tree, topic_panel, topic_title, contents, back, next,
### filter_box, topic_text, topic_scroll_panel, ok). The tree, the top row and the buttons were
### copied from the default theme by script.
###

#define _MOBILE_HELP_TREEVIEW
	[tree_view]
		id = "topic_tree"
		definition = "default"

		horizontal_scrollbar_mode = "never"
		vertical_scrollbar_mode = "auto"

		indentation_step_size = 20

		[node]
			id = "section"
			[node_definition]
				[row]
					[column]
						horizontal_grow = true
						[toggle_panel]
							id = "tree_view_node_label"
							[grid]
								[row]
									[column]
										grow_factor = 0
										border = "left,top,bottom"
										border_size = 10
										[toggle_button]
											id = "tree_view_node_toggle"
											definition = "help_section_toggle"
											linked_group = "images"
										[/toggle_button]
									[/column]

									[column]
										grow_factor = 1
										border = "all"
										border_size = 10
										horizontal_grow = true

										[label]
											id = "topic_name"
											definition = "help_topic_name"
										[/label]
									[/column]
								[/row]
							[/grid]
						[/toggle_panel]
					[/column]
				[/row]
			[/node_definition]
		[/node]

		[node]
			id = "topic"
			[node_definition]
				[row]
					[column]
						horizontal_grow = true
						[toggle_panel]
							id = "tree_view_node_label"
							[grid]
								[row]
									[column]
										grow_factor = 0
										border = "left,top,bottom"
										border_size = 10
										horizontal_alignment = "left"

										[image]
											id = "topic_image"
											definition = "default"
											label = "help/topic.png"
											linked_group = "images"
										[/image]
									[/column]

									[column]
										border = "all"
										border_size = 10
										grow_factor = 1
										horizontal_grow = true

										[label]
											id = "topic_name"
											definition = "help_topic_name"
										[/label]
									[/column]
								[/row]
							[/grid]
						[/toggle_panel]
					[/column]
				[/row]
			[/node_definition]
		[/node]

	[/tree_view]
#enddef
#define _MOBILE_HELP_TOP_GRID
	[grid]

		[row]

			[column]
				grow_factor = 1
				border = "all"
				border_size = 5
				horizontal_grow = true
				vertical_grow = true

				[label]
					definition = "default_large_script"
					id = "topic_title"
				[/label]

			[/column]

			[column]
				border = "all"
				border_size = 5
				horizontal_alignment = "right"

				[toggle_button]
					id = "contents"
					label = _ "Show Topics"
				[/toggle_button]

			[/column]

			[column]
				border = "all"
				border_size = 5
				horizontal_alignment = "right"

				[button]
					id = "back"
					definition = "left_arrow_ornate"
				[/button]

			[/column]

			[column]
				border = "all"
				border_size = 5
				horizontal_alignment = "right"

				[button]
					id = "next"
					definition = "right_arrow_ornate"
				[/button]

			[/column]

			[column]
				border = "all"
				border_size = 5
				horizontal_grow = true

				[text_box]
					id = "filter_box"
					definition = "default"
					{FILTER_TEXT_BOX_HINT}
					tooltip = _ "Search help topic names"
				[/text_box]

			[/column]

		[/row]

	[/grid]
#enddef
#define _MOBILE_HELP_TREE_PANEL
	[panel]
		id = "topic_panel"
		definition = "box_display_treeview_bg"
		[grid]
			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true
					vertical_alignment = top
					border = "all"
					# panel adds internal padding,
					# so this is not needed
					border_size = 0
					{_MOBILE_HELP_TREEVIEW}
				[/column]
			[/row]
		[/grid]
	[/panel]
#enddef

#define _MOBILE_HELP_TEXT
	[scrollbar_panel]
		id = "topic_scroll_panel"
		[definition]
			[row]
				[column]
					horizontal_grow = true
					vertical_grow = true
					[rich_label]
						id = "topic_text"
					[/rich_label]
				[/column]
			[/row]
		[/definition]
	[/scrollbar_panel]
#enddef

#define _MOBILE_HELP_CLOSE
	[button]
		id = "ok"
		label = _ "Close"
	[/button]
#enddef

[window]
	id = "help_browser"
	description = "Battle for Wesnoth Help (Wesnoth Mobile)."

	# Portrait (base resolution)
	[resolution]
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		[tooltip]
			id = "tooltip_large"
		[/tooltip]

		[helptip]
			id = "tooltip_large"
		[/helptip]

		[linked_group]
			id = "images"
			fixed_width = true
		[/linked_group]

		[grid]
			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					{_MOBILE_HELP_TOP_GRID}
				[/column]
			[/row]

			[row]
				grow_factor = 1
				[column]
					horizontal_grow = true
					vertical_grow = true
					border = "all"
					border_size = 5

					{_MOBILE_HELP_TREE_PANEL}
				[/column]
			[/row]

			[row]
				grow_factor = 1
				[column]
					border = "all"
					border_size = 5
					horizontal_grow = true
					vertical_grow = true

					{_MOBILE_HELP_TEXT}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					border = "all"
					border_size = 10
					horizontal_grow = true

					{_MOBILE_HELP_CLOSE}
				[/column]
			[/row]
		[/grid]
	[/resolution]

	# Landscape (800x400 and up)
	[resolution]
		window_width = 800
		window_height = 400
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		[tooltip]
			id = "tooltip_large"
		[/tooltip]

		[helptip]
			id = "tooltip_large"
		[/helptip]

		[linked_group]
			id = "images"
			fixed_width = true
		[/linked_group]

		[grid]
			[row]
				grow_factor = 0
				[column]
					border = "right"
					border_size = 15
					vertical_grow = true
					horizontal_alignment = "left"

					{_MOBILE_HELP_TREE_PANEL}
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[grid]
						[row]
							grow_factor = 0
							[column]
								horizontal_grow = true

								{_MOBILE_HELP_TOP_GRID}
							[/column]
						[/row]

						[row]
							grow_factor = 1
							[column]
								border = "all"
								border_size = 5
								horizontal_grow = true
								vertical_grow = true

								{_MOBILE_HELP_TEXT}
							[/column]
						[/row]

						[row]
							grow_factor = 0
							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								{_MOBILE_HELP_CLOSE}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]

[/window]
