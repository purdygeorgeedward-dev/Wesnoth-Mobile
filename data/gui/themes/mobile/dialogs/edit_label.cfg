#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): edit_label for phones. Editing a map label.
### Copy of the default theme's dialog with only the placement and size rules changed:
###   maximum_width capped to the screen (1); placed at the top (on-screen keyboard) (1).
### The default caps (800 to 900 wide, 600 to 800 tall) are larger than a 540 tall landscape screen or
### a 540 wide portrait screen. The new caps are the screen size minus 20 (at most 900 wide), so the
### same file fits both orientations. Widgets, ids and borders are unchanged.
### The window is at the TOP of the screen because the on-screen keyboard covers the lower half; the default centers it, which puts the text box under the keyboard.
###

###
### Definition of the window to place and edit gamemap labels
###

[window]
	id = "edit_label"
	description = "Map label editor."

	[resolution]
		definition = "default"

		automatic_placement = true
		vertical_placement = "top"
		horizontal_placement = "center"

		maximum_width = "(min(screen_width - 20, 900))"

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]

			[row]
				grow_factor = 0

				[column]
					grow_factor = 1

					border = "all"
					border_size = 5
					horizontal_alignment = "left"
					[label]
						id = "title"
						definition = "title"

						label = _ "Place Label"
					[/label]

				[/column]

			[/row]

			[row]
				grow_factor = 1

				[column]
					grow_factor = 1

					horizontal_grow = true

					[grid]

						[row]
							grow_factor = 1

							[column]
								grow_factor = 0

								border = "all"
								border_size = 5
								horizontal_alignment = "left"

								[label]
									definition = "default"

									label = _ "Label:"
								[/label]

							[/column]

							[column]
								grow_factor = 1

								border = "all"
								border_size = 5
								horizontal_grow = true

								[text_box]
									id = "label"
									definition = "default"
								[/text_box]

							[/column]

						[/row]

					[/grid]

				[/column]

			[/row]

			[row]
				grow_factor = 0

				[column]
					grow_factor = 1
					horizontal_grow = true
					border = "all"
					border_size = 5

					[toggle_button]
						id = "team_only_toggle"
						definition = "default"
						label= _ "Team only"
					[/toggle_button]

				[/column]
			[/row]

			[row]
				grow_factor = 0

				[column]
					horizontal_alignment = "right"

					[grid]

						[row]
							grow_factor = 0

							{GUI_FILLER}

							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								[button]
									id = "ok"
									definition = "default"

									label = _ "OK"
								[/button]

							[/column]

							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								[button]
									id = "cancel"
									definition = "default"

									label = _ "Cancel"
								[/button]

							[/column]

						[/row]

					[/grid]

				[/column]

			[/row]


		[/grid]

	[/resolution]

[/window]
