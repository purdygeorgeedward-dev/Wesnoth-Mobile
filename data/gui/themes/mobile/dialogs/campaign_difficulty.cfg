#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): campaign difficulty selection for phones.
###
### Two layouts, picked by screen size (logical pixels, phone at pixel scale 2):
###   - portrait  (base resolution, about 540x1170): title and message on top,
###     tall difficulty rows filling the middle, big Play/Cancel buttons at the bottom.
###   - landscape (window 800x400 and up, about 1170x540): title, message and buttons
###     on the left, difficulty rows on the right.
### Widget ids match what src/gui/dialogs/campaign_difficulty.cpp looks up:
### title, message, listbox, icon, victory, label, ok, cancel.
### The list rows are copied from the default theme's campaign_difficulty.cfg;
### row padding is larger so each row is a comfortable touch target.
###

#define _MOBILE_DIFFICULTY_GROUPS
		[linked_group]
			id = "panel"
			fixed_height = true
		[/linked_group]

		[linked_group]
			id = "icon"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]
#enddef

#define _MOBILE_DIFFICULTY_TITLE
	[label]
		id = "title"
		definition = "title"
		label = _ "Difficulty"
	[/label]
#enddef

#define _MOBILE_DIFFICULTY_MESSAGE
	[scroll_label]
		id = "message"
		definition = "default"
		label = _ "Select difficulty:"
	[/scroll_label]
#enddef

#define _MOBILE_DIFFICULTY_LIST
	[listbox]
		id = "listbox"
		definition = "default"

		[list_definition]

			[row]

				[column]
					vertical_grow = true
					horizontal_grow = true

					[toggle_panel]
						definition = "default"
						return_value_id = "ok"

						linked_group = "panel"

						[grid]

							[row]

								[column]
									grow_factor = 0
									horizontal_alignment = "left"
									border = "all"
									border_size = 10

									[stacked_widget]
										definition = "default"
										linked_group = "icon"

										[layer]

											[row]

												[column]
													grow_factor = 1
													horizontal_grow = true
													border = "left"
													border_size = 3

													[image]
														id = "victory"
														definition = "default"
														label = "misc/laurel.png"
													[/image]

												[/column]

											[/row]

										[/layer]

										[layer]

											[row]

												[column]
													grow_factor = 1
													horizontal_grow = true
													border = "left"
													border_size = 3

													[image]
														id = "icon"
														definition = "default"
													[/image]

												[/column]

											[/row]

										[/layer]

									[/stacked_widget]

								[/column]

								[column]
									grow_factor = 1
									horizontal_grow = true
									border = "all"
									border_size = 10

									[label]
										id = "label"
										definition = "default_large"
									[/label]

								[/column]

							[/row]

						[/grid]

					[/toggle_panel]

				[/column]

			[/row]

		[/list_definition]

	[/listbox]
#enddef

[window]
	id = "campaign_difficulty"
	description = "Campaign difficulty level selector (Wesnoth Mobile)."

	#
	# Portrait (base resolution): everything stacked, fills the screen.
	#
	[resolution]
		definition = "default"

		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		{_MOBILE_DIFFICULTY_GROUPS}

		[grid]

			[row]
				grow_factor = 0

				[column]
					grow_factor = 1
					horizontal_alignment = "left"
					border = "all"
					border_size = 10

					{_MOBILE_DIFFICULTY_TITLE}
				[/column]
			[/row]

			[row]
				grow_factor = 0

				[column]
					grow_factor = 1
					horizontal_alignment = "left"
					border = "all"
					border_size = 10

					{_MOBILE_DIFFICULTY_MESSAGE}
				[/column]
			[/row]

			# Difficulty rows fill all the remaining height.
			[row]
				grow_factor = 1

				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true
					border = "all"
					border_size = 5

					{_MOBILE_DIFFICULTY_LIST}
				[/column]
			[/row]

			# Play and Cancel side by side, each half the width.
			[row]
				grow_factor = 0

				[column]
					horizontal_grow = true

					[grid]
						[row]
							grow_factor = 0

							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								[button]
									id = "ok"
									definition = "default"
									label = _ "game^Play"
								[/button]
							[/column]

							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								[button]
									id = "cancel"
									definition = "default"
									label = _ "Cancel"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

		[/grid]

	[/resolution]

	#
	# Landscape (800x400 and up): title, message and buttons left, rows right.
	#
	[resolution]
		window_width = 800
		window_height = 400
		definition = "default"

		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		{_MOBILE_DIFFICULTY_GROUPS}

		[grid]

			[row]
				grow_factor = 1

				# Left column: title and message on top, buttons at the bottom.
				[column]
					grow_factor = 0
					vertical_grow = true
					border = "all"
					border_size = 5

					[grid]

						[row]
							grow_factor = 0

							[column]
								horizontal_alignment = "left"
								border = "all"
								border_size = 10

								{_MOBILE_DIFFICULTY_TITLE}
							[/column]
						[/row]

						[row]
							grow_factor = 1

							[column]
								horizontal_grow = true
								vertical_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_DIFFICULTY_MESSAGE}
							[/column]
						[/row]

						[row]
							grow_factor = 0

							[column]
								horizontal_grow = true
								border = "all"
								border_size = 10

								[button]
									id = "ok"
									definition = "default"
									label = _ "game^Play"
								[/button]
							[/column]
						[/row]

						[row]
							grow_factor = 0

							[column]
								horizontal_grow = true
								border = "all"
								border_size = 10

								[button]
									id = "cancel"
									definition = "default"
									label = _ "Cancel"
								[/button]
							[/column]
						[/row]

					[/grid]
				[/column]

				# Right column: difficulty rows fill the height.
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true
					border = "all"
					border_size = 5

					{_MOBILE_DIFFICULTY_LIST}
				[/column]

			[/row]

		[/grid]

	[/resolution]

[/window]
