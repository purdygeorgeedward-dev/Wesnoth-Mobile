#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-01): main menu for phones. Background art changed 2026-11-08 (see window_definition).
###
### Two layouts, picked by screen size (logical pixels, phone at pixel scale 2):
###   - portrait  (base resolution, about 540x1170): logo, menu, tips, footer stacked.
###   - landscape (window 800x400 and up, about 1170x540): logo and tips on the left,
###     menu on the right.
### Every widget id the C++ code looks for (src/gui/dialogs/title_screen.cpp) is kept;
### a missing button makes the game fall back to the default theme.
###

#define _GUI_BG_RATIO
(
	min(bg_hratio, bg_wratio)
where
	bg_hratio = height * 1.0 / image_original_height,
	bg_wratio = width * 1.0 / image_original_width
)
#enddef

#define _GUI_COVER_RATIO
(
	max(bg_hratio, bg_wratio)
where
	bg_hratio = height * 1.0 / image_original_height,
	bg_wratio = width * 1.0 / image_original_width
)
#enddef

#define _GUI_BG_Y
	((height - image_height)/2)
#enddef

#define _GUI_BG_X
	((width - image_width)/2)
#enddef

[window_definition]

	id = "title_screen"
	description = "The window definition for the title screen."

	[resolution]

		# Wesnoth Mobile (2026-11-08): George's splash art without the logo, one image per screen shape
		# (landscape 2400x1080, portrait 1080x2400, square 2400x2400), scaled to cover the window without stretching (see _GUI_COVER_RATIO).
		# The original two stock images are kept below as comments.
		[background]

			[draw]

				# Not stretched: the image keeps its shape, is scaled just enough to cover the whole window,
				# and is centered, so whatever does not fit spills off the edges.
				#[image]
				#w = "(width)"
				#h = "(height)"
				#x = 0
				#y = 0
				#name = "(if(width > height * 1.25, 'maps/splash-landscape.webp', if(width * 1.25 < height, 'maps/splash-portrait.webp', 'maps/splash-square.webp')))"
				#resize_mode = "scale"
				#[/image]
				[image]
					w = "(round(image_original_width * {_GUI_COVER_RATIO}))"
					h = "(round(image_original_height * {_GUI_COVER_RATIO}))"
					x = "((width - image_width) / 2)"
					y = "((height - image_height) / 2)"
					name = "(if(width > height * 1.25, 'maps/splash-landscape.webp', if(width * 1.25 < height, 'maps/splash-portrait.webp', 'maps/splash-square.webp')))"
					resize_mode = "scale"
				[/image]

			[/draw]

		[/background]

		#[background]

		#[draw]

		## For the classic theme, the background has never been changed, so hardcoding them.
		#[image]
		#w = "(width)"
		#h = "(height)"
		#x = 0
		#y = 0
		#name = "maps/background.webp"
		#resize_mode = "scale"
		#[/image]

		#[image]
		#w = "(round(image_original_width * {_GUI_BG_RATIO}))"
		#h = "(round(image_original_height * {_GUI_BG_RATIO}))"
		#x = "(max(0, {_GUI_BG_X}))"
		#y = "(max(0, {_GUI_BG_Y}))"
		#name = "maps/titlescreen.webp"
		#resize_mode = "scale"
		#[/image]

		#[/draw]

		#[/background]

		[foreground]

			[draw]

			[/draw]

		[/foreground]

	[/resolution]

[/window_definition]
#undef _GUI_BG_RATIO
#undef _GUI_BG_Y
#undef _GUI_BG_X

#define _GUI_MOBILE_V_SPACER HEIGHT
	[column]
		[spacer]
			definition = "default"
			height = {HEIGHT}
		[/spacer]
	[/column]
#enddef

#define _GUI_MOBILE_LOGO
	[stacked_widget]
		[layer]
			[row]
				[column]
					horizontal_alignment = "center"
					[image]
						id = "logo-bg"
						definition = "mobile_logo"
					[/image]
				[/column]
			[/row]
		[/layer]
		[layer]
			[row]
				[column]
					horizontal_alignment = "center"
					[image]
						id = "logo"
						definition = "mobile_logo"
					[/image]
				[/column]
			[/row]
		[/layer]
	[/stacked_widget]
#enddef

#define _GUI_MOBILE_BUTTON ID CAPTION TOOLTIP
	[column]
		border = "all"
		border_size = 5
		horizontal_grow = true
		[button]
			id = {ID}
			definition = "default"
			label = {CAPTION}
			tooltip = {TOOLTIP}
		[/button]
	[/column]
#enddef

# Two buttons side by side, so the menu fits a 540-high landscape screen.
#define _GUI_MOBILE_MENU_SECTION
	[panel]
		id = "menu_panel"
		definition = "box_display"

		[grid]
			[row]
				{_GUI_MOBILE_BUTTON "campaign" _"Campaigns" _"Start a new single player campaign"}
				{_GUI_MOBILE_BUTTON "multiplayer" _"Multiplayer" _"Play multiplayer (hotseat, LAN, or Internet), or a single scenario against the AI"}
			[/row]
			[row]
				{_GUI_MOBILE_BUTTON "load" _"Load" _"Load a saved game"}
				{_GUI_MOBILE_BUTTON "addons" _"Add-ons" _"Download usermade campaigns, eras, or map packs"}
			[/row]
			[row]
				{_GUI_MOBILE_BUTTON "achievements" _"Achievements" _"View achievements"}
				{_GUI_MOBILE_BUTTON "editor" _"Map Editor" _"Start the map editor"}
			[/row]
			[row]
				{_GUI_MOBILE_BUTTON "preferences" _"Preferences" _"Configure the game’s settings"}
				{_GUI_MOBILE_BUTTON "help" _"Help" _"Show Battle for Wesnoth help"}
			[/row]
			[row]
				{_GUI_MOBILE_BUTTON "community" _"Community" _"Places to talk about Wesnoth"}
				{_GUI_MOBILE_BUTTON "quit" _"Quit" _"Quit the game"}
			[/row]
			[row]
				# Debug-only buttons; the game hides them in normal play.
				#textdomain wesnoth-test
				{_GUI_MOBILE_BUTTON "clock" _"Clock" _"Show debug clock"}
				{_GUI_MOBILE_BUTTON "test_dialog" _"Test Dialog" _"Show GUI Test Dialog"}
				#textdomain wesnoth-lib
			[/row]
		[/grid]
	[/panel]
#enddef

#define _GUI_MOBILE_TIP_SECTION
	[panel]
		id = "tip_panel"
		definition = "box_display"

		[grid]
			[row]
				grow_factor = 1
				[column]
					horizontal_grow = true
					vertical_grow = true

					[multi_page]
						id = "tips"
						definition = "default"

						[page_definition]
							[row]
								grow_factor = 1
								[column]
									border = "all"
									border_size = 5
									horizontal_grow = true
									vertical_grow = true
									[label]
										id = "tip"
										definition = "title_screen_tip"
										wrap = true
									[/label]
								[/column]
							[/row]
							[row]
								[column]
									border = "all"
									border_size = 5
									horizontal_grow = true
									[label]
										id = "source"
										definition = "title_screen_tip_plain"
										text_alignment = "right"
										wrap = true
									[/label]
								[/column]
							[/row]
						[/page_definition]
					[/multi_page]
				[/column]
			[/row]

			[row]
				[column]
					horizontal_grow = true
					[grid]
						[row]
							[column]
								grow_factor = 1
								[spacer]
								[/spacer]
							[/column]
							[column]
								border = "all"
								border_size = 5
								[button]
									id = "previous_tip"
									definition = "default"
									label = _ "Previous"
									tooltip = _"Show previous tip of the day"
								[/button]
							[/column]
							[column]
								border = "all"
								border_size = 5
								[button]
									id = "next_tip"
									definition = "default"
									label = _ "Next"
									tooltip = _"Show next tip of the day"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/panel]
#enddef

#define _GUI_MOBILE_FOOTER
	[grid]
		[row]
			[column]
				grow_factor = 0
				horizontal_alignment = "left"
				[button]
					id = "about"
					definition = "titlescreen_about"
					label = _ "About"
					tooltip = _ "General information about Battle for Wesnoth"
				[/button]
			[/column]
			[column]
				grow_factor = 1
				horizontal_alignment = "left"
				border = "left"
				border_size = 5
				[label]
					id = "revision_number"
					definition = "default_small"
				[/label]
			[/column]
			[column]
				grow_factor = 0
				horizontal_alignment = "right"
				[button]
					id = "language"
					definition = "titlescreen_language"
					label = _ "Language"
					tooltip = _ "Change the language"
				[/button]
			[/column]
		[/row]
	[/grid]
#enddef

[window]
	id = "title_screen"
	description = "The game’s main menu (phone layouts)."

	# ---- Portrait (base): everything stacked top to bottom ----
	[resolution]
		definition = "title_screen"

		{GUI_WINDOW_FULLSCREEN}

		[tooltip]
			id = "tooltip_large"
		[/tooltip]

		[helptip]
			id = "tooltip_large"
		[/helptip]

		[grid]
			[row]
				{_GUI_MOBILE_V_SPACER 20}
			[/row]
			[row]
				[column]
					horizontal_alignment = "center"
					{_GUI_MOBILE_LOGO}
				[/column]
			[/row]
			[row]
				grow_factor = 1
				[column]
					border = "all"
					border_size = 10
					horizontal_grow = true
					vertical_alignment = "center"
					{_GUI_MOBILE_MENU_SECTION}
				[/column]
			[/row]
			[row]
				[column]
					border = "left,right"
					border_size = 10
					horizontal_grow = true
					{_GUI_MOBILE_TIP_SECTION}
				[/column]
			[/row]
			[row]
				[column]
					border = "all"
					border_size = 10
					horizontal_grow = true
					vertical_alignment = "bottom"
					{_GUI_MOBILE_FOOTER}
				[/column]
			[/row]
		[/grid]
	[/resolution]

	# ---- Landscape: logo and tips on the left, menu on the right ----
	[resolution]
		definition = "title_screen"
		window_width = 800
		window_height = 400

		{GUI_WINDOW_FULLSCREEN}

		[tooltip]
			id = "tooltip_large"
		[/tooltip]

		[helptip]
			id = "tooltip_large"
		[/helptip]

		[grid]
			[row]
				grow_factor = 1
				[column]
					horizontal_grow = true
					vertical_grow = true
					[grid]
						[row]
							[column]
								grow_factor = 1
								border = "all"
								border_size = 10
								horizontal_grow = true
								vertical_grow = true
								[grid]
									[row]
										[column]
											horizontal_alignment = "center"
											{_GUI_MOBILE_LOGO}
										[/column]
									[/row]
									[row]
										grow_factor = 1
										[column]
											border = "top"
											border_size = 10
											horizontal_grow = true
											vertical_alignment = "bottom"
											{_GUI_MOBILE_TIP_SECTION}
										[/column]
									[/row]
								[/grid]
							[/column]
							[column]
								border = "all"
								border_size = 10
								vertical_alignment = "center"
								{_GUI_MOBILE_MENU_SECTION}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				[column]
					border = "bottom,left,right"
					border_size = 10
					horizontal_grow = true
					{_GUI_MOBILE_FOOTER}
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]

#undef _GUI_MOBILE_V_SPACER
#undef _GUI_MOBILE_LOGO
#undef _GUI_MOBILE_BUTTON
#undef _GUI_MOBILE_MENU_SECTION
#undef _GUI_MOBILE_TIP_SECTION
#undef _GUI_MOBILE_FOOTER
