#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): preferences dialog for phones.
###
### The pages (General, Hotkeys, Display, Sound, Multiplayer, Advanced) are the default theme's,
### included unchanged from data/gui/themes/default/dialogs/preferences/. The default window is
### up to 650 tall and its pages do not scroll, so on a 540 tall landscape screen the lower part
### of each page would be cut off. Here:
###   - the window fills the screen in both orientations;
###   - the tab container sits inside a scrollbar_panel, so a page taller than the screen scrolls;
###   - portrait (base resolution, about 540x1170) uses the "horizontal" tab container, with the
###     page tabs in a row across the top, so the page gets the full width;
###   - landscape (window 800x400 and up, about 1170x540) keeps the vertical tab list on the left.
### Widget ids are unchanged (title, pager, about, ok, and everything in the pages). The macros
### below are copied from the top of the default preferences.cfg, because the pages use them and
### the default file removes them again at its end.
###
###
### Main game preferences dialog.
###

#define _GUI_INFO_TAB_PADDING
	[column]
		border = all
		border_size = 5

		[spacer]
			width = 10
		[/spacer]

	[/column]
#enddef

#define _GUI_PREFERENCES_MAIN_COMPOSITE_SLIDER _LABEL_TEXT _SLIDER_ID _SLIDER_ATTRIBUTES
	[grid]
		[row]
			[column]
				horizontal_grow = true
				[grid]
					[row]
						[column]
							grow_factor = 0
							border = "top,left,right"
							border_size = 5
							horizontal_alignment = "left"

							[label]
								id = "help_text"
								definition = "default_small"
								label = {_LABEL_TEXT}
							[/label]
						[/column]

						[column]
							grow_factor = 1
							border = "top,right"
							border_size = 5
							horizontal_grow = true

							[label]
								id = {_SLIDER_ID} + "_label"
								definition = "default_small"
							[/label]
						[/column]
					[/row]
				[/grid]
			[/column]
		[/row]
		[row]
			[column]
				border = "all"
				border_size = 5
				horizontal_grow = true

				[slider]
					id = {_SLIDER_ID}
					definition = "minimal"
					{_SLIDER_ATTRIBUTES}
				[/slider]
			[/column]
		[/row]
	[/grid]
#enddef

[window]
	id = "preferences_dialog"
	description = "Main game preferences dialog (Wesnoth Mobile)."

	# Portrait (base resolution)
	[resolution]
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"


		[linked_group]
			id = "page_icon"
			fixed_width = true
			fixed_height = true
		[/linked_group]

		[linked_group]
			id = "page_label"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "tabs"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "friends"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "advanced_pref_name"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "advanced_pref_value"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hotkeys_col_icon"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hotkeys_col_desc"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hotkeys_col_hotkey"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hotkeys_col_type"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hotkeys_categories"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]

			[row]
				grow_factor = 0

				[column]
					grow_factor = 1

					border = "all"
					border_size = 5
					horizontal_alignment = "left"
					[label]
						id =  "title"
						definition = "title"
						label = _ "Preferences"
					[/label]
				[/column]

			[/row]

			[row]
				grow_factor = 1

				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[scrollbar_panel]
						[definition]
							[row]
								[column]
									horizontal_grow = true
									vertical_grow = true
									[tab_container]
										id = "pager"
										definition = "horizontal"
										{gui/themes/default/dialogs/preferences/}
									[/tab_container]
								[/column]
							[/row]
						[/definition]
					[/scrollbar_panel]

				[/column]
			[/row]

			[row]
				[column]
					horizontal_grow = true
					[grid]
						[row]
							[column]
								horizontal_alignment = "left"
								border = "all"
								border_size = 10

								[button]
									id = "about"
									definition = "action_about"
									tooltip = _ "Display the game version and build information"
								[/button]
							[/column]

							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "right"

								[button]
									id = "ok"
									definition = "default"
									label = _ "Close"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]

	[/resolution]

	# Landscape (800x400 and up)
	[resolution]
		window_width = 800
		window_height = 400
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"


		[linked_group]
			id = "page_icon"
			fixed_width = true
			fixed_height = true
		[/linked_group]

		[linked_group]
			id = "page_label"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "tabs"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "friends"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "advanced_pref_name"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "advanced_pref_value"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hotkeys_col_icon"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hotkeys_col_desc"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hotkeys_col_hotkey"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hotkeys_col_type"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hotkeys_categories"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]

			[row]
				grow_factor = 0

				[column]
					grow_factor = 1

					border = "all"
					border_size = 5
					horizontal_alignment = "left"
					[label]
						id =  "title"
						definition = "title"
						label = _ "Preferences"
					[/label]
				[/column]

			[/row]

			[row]
				grow_factor = 1

				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[scrollbar_panel]
						[definition]
							[row]
								[column]
									horizontal_grow = true
									vertical_grow = true
									[tab_container]
										id = "pager"
										{gui/themes/default/dialogs/preferences/}
									[/tab_container]
								[/column]
							[/row]
						[/definition]
					[/scrollbar_panel]

				[/column]
			[/row]

			[row]
				[column]
					horizontal_grow = true
					[grid]
						[row]
							[column]
								horizontal_alignment = "left"
								border = "all"
								border_size = 10

								[button]
									id = "about"
									definition = "action_about"
									tooltip = _ "Display the game version and build information"
								[/button]
							[/column]

							[column]
								border = "all"
								border_size = 10
								horizontal_alignment = "right"

								[button]
									id = "ok"
									definition = "default"
									label = _ "Close"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]

	[/resolution]

[/window]

#undef _GUI_PREFS_PLACEHOLDER
