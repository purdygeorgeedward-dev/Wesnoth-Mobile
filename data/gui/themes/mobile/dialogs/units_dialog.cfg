#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): units dialog for phones. One dialog serves recruit, recall,
### the unit list and the debug unit creation (src/gui/dialogs/units_dialog.cpp).
###
### Two layouts, picked by screen size (logical pixels, phone at pixel scale 2):
###   - portrait  (base resolution, about 540x1170): fills the screen. Title, search box,
###     the unit list (takes all spare height), the unit preview pane below it, then
###     the gender/variation row and the buttons stacked. Wide list rows scroll sideways.
###   - landscape (window 800x400 and up, about 1170x540): fills the screen. Title and search
###     on one row, preview pane left and unit list right, then gender/variation, and ONE row
###     of buttons (help on the left, dismiss/rename/favorite, then ok and cancel).
###     The default theme's window is up to 750 tall and does not fit 540.
###
### The list (headers, row template, sort toggles) is copied unchanged from the default theme,
### because units_dialog.cpp looks up every column id for sorting. Only the row padding is larger
### (8 instead of 5). All widget ids of the window are kept.
###

#define _MOBILE_UNITS_LIST
	[listbox]
		id = "main_list"
		definition = "default"

		[header]
			[row]
				[column]
					grow_factor = 1
					horizontal_grow = true

					# No border by design
					[toggle_button]
						id = "unit_favorite"
						definition = "listbox_header"
						linked_group = "favorite"

						#po: Filled five pointed star, used as favorite unit marker
						label = _ "★"
					[/toggle_button]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true

					[spacer]
						definition = "default"
						linked_group = "image"
					[/spacer]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true

					# No border by design
					[toggle_button]
						id = "unit_name"
						definition = "listbox_header"
						linked_group = "name"

						label = _ "Name"
					[/toggle_button]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true

					# No border by design
					[toggle_button]
						id = "unit_details"
						definition = "listbox_header"
						linked_group = "type"

						label = _ "Type"
					[/toggle_button]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true

					# No border by design
					[toggle_button]
						id = "unit_level"
						definition = "listbox_header"
						linked_group = "level"

						label = _ "Lvl"
					[/toggle_button]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true

					# No border by design
					[toggle_button]
						id = "unit_moves"
						definition = "listbox_header"
						linked_group = "moves"

						label = _ "Moves"
					[/toggle_button]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true

					# No border by design
					[toggle_button]
						id = "unit_hp"
						definition = "listbox_header"
						linked_group = "hitpoints"

						label = _ "HP"
					[/toggle_button]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true

					# No border by design
					[toggle_button]
						id = "unit_xp"
						definition = "listbox_header"
						linked_group = "experience"

						label = _ "XP"
					[/toggle_button]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_alignment = "center"

					# No border by design
					[toggle_button]
						id = "unit_status"
						definition = "listbox_header"
						linked_group = "status"

						label = _ "Status"
					[/toggle_button]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true

					# No border by design
					[toggle_button]
						id = "unit_traits"
						definition = "listbox_header"
						linked_group = "traits"

						label = _ "Traits"
					[/toggle_button]
				[/column]
			[/row]
		[/header]

		[list_definition]
			[row]
				[column]
					vertical_grow = true
					horizontal_grow = true

					[toggle_panel]
						id = "row_panel"
						definition = "default"
						return_value_id = "ok"

						[grid]
							[row]
								[column]
									border = "all"
									border_size = 8
									horizontal_grow = true
									vertical_alignment = "center"

									[label]
										id = "unit_favorite"
										linked_group = "favorite"
									[/label]
								[/column]

								[column]
									border = "all"
									border_size = 8
									horizontal_grow = true
									vertical_alignment = "center"

									[image]
										id = "unit_image"
										linked_group = "image"
									[/image]
								[/column]

								[column]
									border = "all"
									border_size = 8
									horizontal_grow = true
									vertical_alignment = "center"

									[label]
										id = "unit_name"
										definition = "default"
										linked_group = "name"
									[/label]
								[/column]

								[column]
									border = "all"
									border_size = 8
									horizontal_grow = true
									vertical_alignment = "center"

									[rich_label]
										id = "unit_details"
										definition = "default"
										linked_group = "type"
										link_aware = false
									[/rich_label]
								[/column]

								[column]
									border = "all"
									border_size = 8
									horizontal_grow = true
									vertical_alignment = "center"

									[label]
										id = "unit_level"
										definition = "default"
										linked_group = "level"
									[/label]
								[/column]

								[column]
									border = "all"
									border_size = 8
									horizontal_grow = true
									vertical_alignment = "center"

									[label]
										id = "unit_moves"
										definition = "default_small"
										linked_group = "moves"
									[/label]
								[/column]

								[column]
									border = "all"
									border_size = 8
									horizontal_grow = true
									vertical_alignment = "center"

									[label]
										id = "unit_hp"
										definition = "default_small"
										linked_group = "hitpoints"
									[/label]
								[/column]

								[column]
									border = "all"
									border_size = 8
									horizontal_grow = true
									vertical_alignment = "center"

									[label]
										id = "unit_xp"
										definition = "default_small"
										linked_group = "experience"
									[/label]
								[/column]
								[column]
									border = "all"
									border_size = 8
									horizontal_grow = true
									vertical_alignment = "center"

									[image]
										id = "unit_status"
										linked_group = "status"
									[/image]
								[/column]

								[column]
									border = "all"
									border_size = 8
									horizontal_grow = true
									vertical_alignment = "center"

									[label]
										id = "unit_traits"
										definition = "default_small"
										linked_group = "traits"
									[/label]
								[/column]
							[/row]
						[/grid]
					[/toggle_panel]
				[/column]
			[/row]
		[/list_definition]
	[/listbox]
#enddef

#define _MOBILE_UNITS_TITLE
	[label]
		definition = "title"
		id = "title"
	[/label]
#enddef

#define _MOBILE_UNITS_FILTER
	[text_box]
		id = "filter_box"
		definition = "default"
		{FILTER_TEXT_BOX_HINT}
		tooltip = _ "Search for unit name, unit type name, unit level, or trait"
	[/text_box]
#enddef

#define _MOBILE_UNITS_PREVIEW
	[unit_preview_pane]
		definition = "default"
		id = "unit_details"
	[/unit_preview_pane]
#enddef

#define _MOBILE_UNITS_VARIATION
	[grid]
		id = "variation_gender_grid"
		[row]
			[column]
				horizontal_alignment = "left"

				[grid]
					[row]
						[column]
							border = "all"
							border_size = 10

							[toggle_button]
								id = "male_toggle"
								definition = "radio"
								label = _ "Male"
							[/toggle_button]
						[/column]

						[column]
							border = "all"
							border_size = 10

							[toggle_button]
								id = "female_toggle"
								definition = "radio"
								label = _ "Female"
							[/toggle_button]
						[/column]
					[/row]
				[/grid]
			[/column]

			[column]
				grow_factor = 1
				horizontal_grow = true
				border = "all"
				border_size = 10
				horizontal_alignment = "right"

				[menu_button]
					id = "variation_box"
					definition = "default"
				[/menu_button]
			[/column]
		[/row]
	[/grid]
#enddef

#define _MOBILE_UNITS_BTN_DISMISS
	[button]
		id = "dismiss"
		definition = "default"
		label = _ "Dismiss"
	[/button]
#enddef

#define _MOBILE_UNITS_BTN_RENAME
	[button]
		id = "rename"
		definition = "default"
		label = _ "Rename"
	[/button]
#enddef

#define _MOBILE_UNITS_BTN_FAVORITE
	[button]
		id = "mark_favorite"
		definition = "default"
		#po: Filled five pointed star, used as favorite unit marker
		label = _ "★"
		tooltip = _ "Mark/unmark the selected unit as favorite"
	[/button]
#enddef

#define _MOBILE_UNITS_BTN_HELP
	[button]
		id = "show_help"
		definition = "help"
	[/button]
#enddef

#define _MOBILE_UNITS_BTN_OK
	[button]
		id = "ok"
		definition = "default"
	[/button]
#enddef

#define _MOBILE_UNITS_BTN_CANCEL
	[button]
		id = "cancel"
		definition = "default"
		label = _ "Cancel"
	[/button]
#enddef

[window]
	id = "units_dialog"
	description = "Unified unit recruit/recall/list and creation dialog (Wesnoth Mobile)."

	# Portrait (base resolution)
	[resolution]
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		[linked_group]
			id = "favorite"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "image"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "name"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "type"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "level"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "moves"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hitpoints"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "experience"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "status"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "traits"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0
				[column]
					horizontal_alignment = "left"
					border = "all"
					border_size = 10

					{_MOBILE_UNITS_TITLE}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 10

					{_MOBILE_UNITS_FILTER}
				[/column]
			[/row]

			# The list takes all the spare height.
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true
					border = "all"
					border_size = 5

					{_MOBILE_UNITS_LIST}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 5

					{_MOBILE_UNITS_PREVIEW}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					{_MOBILE_UNITS_VARIATION}
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_UNITS_BTN_DISMISS}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_UNITS_BTN_RENAME}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_UNITS_BTN_FAVORITE}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 0
								horizontal_alignment = "left"
								border = "all"
								border_size = 10

								{_MOBILE_UNITS_BTN_HELP}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_UNITS_BTN_OK}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 10

								{_MOBILE_UNITS_BTN_CANCEL}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]

	# Landscape (800x400 and up)
	[resolution]
		window_width = 800
		window_height = 400
		definition = "default"
		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		[linked_group]
			id = "favorite"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "image"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "name"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "type"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "level"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "moves"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "hitpoints"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "experience"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "status"
			fixed_width = true
		[/linked_group]

		[linked_group]
			id = "traits"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]
			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 1
								horizontal_alignment = "left"
								border = "all"
								border_size = 5

								{_MOBILE_UNITS_TITLE}
							[/column]
							[column]
								horizontal_alignment = "right"
								border = "all"
								border_size = 5

								{_MOBILE_UNITS_FILTER}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			# Preview pane left, list right (the list takes all the spare space).
			[row]
				grow_factor = 1
				[column]
					horizontal_grow = true
					vertical_grow = true

					[grid]
						[row]
							grow_factor = 1
							[column]
								grow_factor = 0
								vertical_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_UNITS_PREVIEW}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								vertical_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_UNITS_LIST}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					{_MOBILE_UNITS_VARIATION}
				[/column]
			[/row]

			# One row of buttons: help at the left, then dismiss, rename, favorite, ok, cancel.
			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								grow_factor = 1
								horizontal_alignment = "left"
								border = "all"
								border_size = 5

								{_MOBILE_UNITS_BTN_HELP}
							[/column]
							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								{_MOBILE_UNITS_BTN_DISMISS}
							[/column]
							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								{_MOBILE_UNITS_BTN_RENAME}
							[/column]
							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								{_MOBILE_UNITS_BTN_FAVORITE}
							[/column]
							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								{_MOBILE_UNITS_BTN_OK}
							[/column]
							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								{_MOBILE_UNITS_BTN_CANCEL}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]

[/window]
