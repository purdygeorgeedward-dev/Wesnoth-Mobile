#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-01): campaign selection for phones.
###
### Two layouts, picked by screen size (logical pixels, phone at pixel scale 2):
###   - portrait  (base resolution, about 540x1170): title, search, list, details,
###     options and buttons stacked, filling the screen.
###   - landscape (window 800x400 and up, about 1170x540): list on the left,
###     details on the right, options and buttons underneath.
### Widget ids match what src/gui/dialogs/campaign_selection.cpp looks up.
### The list, details pane, header, and the Combat/Difficulty menus are copied
### from the default theme's campaign_dialog.cfg; list rows are taller for touch.
###

#define _MOBILE_CAMPAIGN_TREE
	[tree_view]
		id = "campaign_tree"
		definition = "default"
		has_minimum = false

		horizontal_scrollbar_mode = "never"
		vertical_scrollbar_mode = "always"

		indentation_step_size = 20

		[node]
			id = "campaign"

			[node_definition]

				[row]

					[column]
						horizontal_grow = true

						[toggle_panel]
							id = "tree_view_node_label"
							definition = "fancy"
							return_value_id = "ok"

							[grid]

								[row]

									[column]
										border = "all"
										border_size = 10
										vertical_alignment = "top"

										[stacked_widget]
											definition = "default"
											linked_group = "icon_area"

											[layer]

												[row]

													[column]
														grow_factor = 1
														horizontal_grow = true

														border = "left"
														border_size = 3

														[image]
															id = "victory"
															definition = "default"

															label = "misc/blank-hex.png"
														[/image]

													[/column]

												[/row]

											[/layer]

											[layer]

												[row]

													[column]
														grow_factor = 1
														horizontal_grow = true

														border = "left"
														border_size = 3

														[image]
															id = "icon"
															definition = "default"

															label = "misc/laurel.png"
														[/image]

													[/column]

												[/row]

											[/layer]

										[/stacked_widget]

									[/column]

									[column]
										grow_factor = 1
										horizontal_grow = true

										border = "right"
										border_size = 8

										[label]
											id = "name"
											definition = "default"
											linked_group = "name"
										[/label]

									[/column]

								[/row]

							[/grid]

						[/toggle_panel]

					[/column]

				[/row]

			[/node_definition]

		[/node]

	[/tree_view]
#enddef

#define _MOBILE_CAMPAIGN_DESCRIPTION
	[row]
		grow_factor = 0
		[column]
			horizontal_grow = true
			vertical_alignment = "top"
			border = "all"
			border_size = 5

			[label]
				id = "description"
				wrap = true
				link_aware = true
			[/label]
		[/column]
	[/row]

	[row]
		grow_factor = 1
		[column]
			horizontal_alignment = "center"
			vertical_alignment = "center"
			border = "all"
			border_size = 5

			[image]
				id = "image"
			[/image]
		[/column]
	[/row]
#enddef

#define _MOBILE_CAMPAIGN_RIGHT_PANE
	[multi_page]
		id = "campaign_details"
		horizontal_scrollbar_mode = "never"

		[page_definition]
			[row]
				[column]
					horizontal_grow = true
					vertical_grow = true

					[scrollbar_panel]
						[definition]
							{_MOBILE_CAMPAIGN_DESCRIPTION}
						[/definition]
					[/scrollbar_panel]
				[/column]
			[/row]
		[/page_definition]

		#
		# NOTE: these special page definitions are referenced by ID in the engine
		#

		[page_definition]
			id = "no_campaign_selected"
			[row]
				[column]
					horizontal_grow = true
					vertical_grow = true

					[scrollbar_panel]
						[definition]
							[row]
								grow_factor = 0
								[column]
									horizontal_grow = true
									vertical_alignment = "top"
									border = "all"
									border_size = 5

									[label]
# wmllint: markcheck off
										label = "<big><b>" +
# wmllint: markcheck on
#po: The campaign_landing^ strings are shown in the right-hand panel when the campaign menu is opened.
#po: This one is the page title, shown in bold.
_"campaign_landing^Welcome to Wesnoth v1.20" + "</b></big>

" + _"campaign_landing^<b>If you’re new to Wesnoth</b>, the opening story arc starts with <span color='#e1e119' style='italic'>The South Guard</span> and follows the campaigns in the order that they’re listed on the left, concluding half a century later with <span color='#e1e119' style='italic'>Heir to the Throne</span>. The intended way to learn both the story and the game mechanics is to play the campaigns in that order." + "

" + _"campaign_landing^<b>If you’re a returning player</b>, you’ll notice a number of changes since v1.18:" + "

" + _"campaign_landing^<span color='#e1e119' style='italic'>Heir to the Throne</span> now features an open world with 33 branching scenarios, each awarding Konrad unique recruits, companions, or items. The original campaign is still available as <i>Heir to the Throne, Classic</i>." + "

" + _"campaign_landing^<span color='#e1e119' style='italic'>The Deceiver’s Gambit</span> replaces <i>Delfador’s Memoirs</i>. Follow a young mage from the shores of Alduin to the halls of the King as they war against the fierce orcs of the north. Choose between 23 magic spells as you bear witness to the rise of a tyrant." + "

" + _"campaign_landing^<span color='#e1e119' style='italic'>Dusk of Dawn</span> is our first troll campaign. Lead the Golden Flame Tribe out from the bowels of Irdya and up to the surface world — but beware what awaits you there." + "

" + _"campaign_landing^<span color='#e1e119' style='italic'>Of Pearls and Pirates</span> is a new beginner-oriented campaign set in a sleepy fishing town on the Bay of Pearls. When corsairs strike, the villagers must join forces with the local merfolk and take the fight to the pirates." + "

" + _"campaign_landing^<span color='#e1e119' style='italic'>The South Guard</span> has been significantly revised, and now replaces the classic <i>Battle Training</i> tutorial. For players nostalgic for Delfador's tutelage, the original tutorial is still available as part of <i>Heir to the Throne, Classic</i>." + "

" + _"campaign_landing^<span color='#e1e119' style='italic'>The Hammer of Thursagan</span> has been enhanced with story adjustments, improved enemy AI, a new Thunderer advancement, a redesign of <i>High Pass</i>, and the re-addition of the formerly removed <i>Mages and Drakes</i>." + "

" + _"campaign_landing^<span color='#e1e119' style='italic'>Winds of Fate</span> has been rebalanced with much lower recall costs, redesigned wildlife spawners and AI, and a much larger mid-campaign battle. Several characters and dialogue sequences were changed for better continuity with other campaigns." + "

" + _"campaign_landing^For a full list of changes, consult our official changelog at https://www.wesnoth.org/start/1.20/"
										link_aware = true
										use_markup = true
										wrap = true
									[/label]
								[/column]
							[/row]
						[/definition]
					[/scrollbar_panel]
				[/column]
			[/row]
		[/page_definition]

		[page_definition]
			id = "go_download_more_stuff"
			[row]
				[column]
					horizontal_grow = true
					vertical_grow = true

					[label]
						label = _ "In addition to the mainline campaigns, Wesnoth also has an ever-growing list of add-on content created by other players available via the Add-ons server, included but not limited to more single and multiplayer campaigns, multiplayer maps, additional media and various other content! Be sure to give it a try!"
						wrap = true
					[/label]
				[/column]
			[/row]
		[/page_definition]

		[page_definition]
			id = "missing_campaign_warning"
			[row]
				[column]
					horizontal_grow = true
					vertical_grow = true

					[label]
						#po: "more than 15" gives a little leeway to add or remove one without changing the translatable text.
						#po: It's already ambiguous, 1.18 has 19 campaigns, if you include the tutorial and multiplayer-only World Conquest.
						label = _ "Wesnoth normally includes more than 15 mainline campaigns, even before installing any from the add-ons server. If you’ve installed the game via a package manager, there’s probably a separate package to install the complete game data."
						wrap = true
					[/label]
				[/column]
			[/row]
		[/page_definition]
	[/multi_page]
#enddef

#define _MOBILE_CAMPAIGN_HEADER
	[panel]
								definition = "panel_listbox_bg"
								[grid]
								[row]
									[column]
										grow_factor = 1
										horizontal_grow = true

										[toggle_button]
											definition = "listbox_header_centered"
											id = "sort_name"
											label = _"Name"
											tooltip = _"Sort by full campaign name in alphabetical order"
										[/toggle_button]
									[/column]

									[column]
										grow_factor = 1
										horizontal_grow = true

										[toggle_button]
											definition = "listbox_header_centered"
											id = "sort_time"
											label = _"Timeline"
											tooltip = _"Sort in approximate chronological order of story events"
										[/toggle_button]
									[/column]

									[column]
										grow_factor = 1
										horizontal_grow = true

										[multimenu_button]
											id = "filter_completion"
											tooltip = _"Filter by campaign completion status"
											[option]
												checkbox = yes
												label = _ "Not Completed"
												#po: campaigns which the player hasn't beaten, rather than campaigns which the author hasn't finished writing
												tooltip = _ "Show campaigns not completed by player"
											[/option]
											[option]
												checkbox = yes
												label = _ "Completed: Bronze"
												tooltip = _ "Show campaigns completed at easiest difficulty"
											[/option]
											[option]
												checkbox = yes
												label = _ "Completed: Silver"
												tooltip = _ "Show campaigns completed at intermediate difficulties"
											[/option]
											[option]
												checkbox = yes
												label = _ "Completed: Gold"
												tooltip = _ "Show campaigns completed at hardest difficulty"
											[/option]
											[option]
												checkbox = yes
												label = _ "Completed: All"
												tooltip = _ "Show completed campaigns"
											[/option]
										[/multimenu_button]
									[/column]
								[/row]
								[/grid]
							[/panel]
#enddef

#define _MOBILE_CAMPAIGN_RNG_MENU
	[menu_button]
					id = "rng_menu"
					use_markup = true

					[option]
						label = _ "Default RNG"
						tooltip = _ "Pure, unbiased randomness; the way Wesnoth is intended to be played.

Example: if you strike twice with 50% accuracy, you’re most likely to hit once and miss once, but might also hit twice or miss twice."
					[/option]
					[option]
						label = _ "Predictable RNG"
						tooltip = _ "Identical to Default RNG, except loading a saved game will not change the outcome of an attack.

Example: you strike twice and get lucky, hitting both strikes. You then load an earlier save and make the same attack again. Both strikes will still hit."
					[/option]
					[option]
						label = _ "Reduced RNG"
						tooltip = _ "Hits and misses are much more consistent. This tends to make small-scale engagements easier to plan.

Example: if you strike three times with 50% accuracy, you will always hit at least once and miss at least once."
					[/option]
				[/menu_button]
#enddef

#define _MOBILE_CAMPAIGN_DIFFICULTY_MENU
	[menu_button]
					id = "difficulty_menu"

					[option]
						label = _ "Easy"
					[/option]
					[option]
						label = _ "Normal"
					[/option]
					[option]
						label = _ "Hard"
					[/option]
				[/menu_button]
#enddef

#define _MOBILE_CAMPAIGN_TITLE
	[label]
		definition = "title"
		label = _ "Play a Campaign"
	[/label]
#enddef

#define _MOBILE_CAMPAIGN_FILTER_BOX
	[text_box]
		id = "filter_box"
		definition = "default"
		{FILTER_TEXT_BOX_HINT}
	[/text_box]
#enddef

#define _MOBILE_CAMPAIGN_MODS_MENU
	[multimenu_button]
		id = "mods_menu"
	[/multimenu_button]
#enddef

#define _MOBILE_CAMPAIGN_BUTTONS
	[grid]
		[row]
			[column]
				horizontal_alignment = "right"
				border = "all"
				border_size = 5

				[button]
					id = "ok"
					definition = "really_large"
					label = _ "game^Play"
				[/button]
			[/column]

			[column]
				horizontal_alignment = "right"
				border = "all"
				border_size = 5

				[button]
					id = "cancel"
					label = _ "Cancel"
				[/button]
			[/column]
		[/row]
	[/grid]
#enddef

#define _MOBILE_CAMPAIGN_COMMON_GROUPS
	[linked_group]
		id = "icon_area"
		fixed_width = true
	[/linked_group]

	[linked_group]
		id = "name"
		fixed_width = true
	[/linked_group]

	[tooltip]
		id = "tooltip"
	[/tooltip]

	[helptip]
		id = "tooltip"
	[/helptip]
#enddef

#define _MOBILE_CAMPAIGN_LABEL TEXT
	[label]
		definition = "default_small"
		label = {TEXT}
	[/label]
#enddef

[window]
	id = "campaign_selection"
	description = "Campaign selection dialog (Wesnoth Mobile)."

	#
	# Portrait (base resolution): everything stacked, fills the screen.
	#
	[resolution]
		definition = "default"

		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		{_MOBILE_CAMPAIGN_COMMON_GROUPS}

		[grid]
			[row]
				[column]
					horizontal_alignment = "left"
					border = "all"
					border_size = 5

					{_MOBILE_CAMPAIGN_TITLE}
				[/column]
			[/row]

			[row]
				[column]
					horizontal_grow = true
					border = "all"
					border_size = 5

					{_MOBILE_CAMPAIGN_FILTER_BOX}
				[/column]
			[/row]

			# List on top, details underneath, both inside the campaign background.
			[row]
				grow_factor = 1
				[column]
					horizontal_grow = true
					vertical_grow = true
					border = "all"
					border_size = 5

					[panel]
						id = "campaign_background"
						definition = "campaign_menu_bg"

						[grid]
							[row]
								[column]
									horizontal_grow = true
									border = "left,right,top"
									border_size = 5

									{_MOBILE_CAMPAIGN_HEADER}
								[/column]
							[/row]

							[row]
								grow_factor = 3
								[column]
									horizontal_grow = true
									vertical_grow = true
									border = "left,bottom,right"
									border_size = 5

									{_MOBILE_CAMPAIGN_TREE}
								[/column]
							[/row]

							[row]
								grow_factor = 2
								[column]
									horizontal_grow = true
									vertical_grow = true
									border = "all"
									border_size = 5

									{_MOBILE_CAMPAIGN_RIGHT_PANE}
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]

			# Options: label above/next to each menu, one pair per row.
			[row]
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								horizontal_alignment = "left"
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_LABEL _"Modifications:"}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_MODS_MENU}
							[/column]
						[/row]

						[row]
							[column]
								horizontal_alignment = "left"
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_LABEL _"Combat:"}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_RNG_MENU}
							[/column]
						[/row]

						[row]
							[column]
								horizontal_alignment = "left"
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_LABEL _"Difficulty:"}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_DIFFICULTY_MENU}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				[column]
					horizontal_alignment = "right"

					{_MOBILE_CAMPAIGN_BUTTONS}
				[/column]
			[/row]
		[/grid]
	[/resolution]

	#
	# Landscape (800x400 and up): list left, details right.
	#
	[resolution]
		window_width = 800
		window_height = 400
		definition = "default"

		automatic_placement = false
		x = 0
		y = 0
		width = "(screen_width)"
		height = "(screen_height)"

		{_MOBILE_CAMPAIGN_COMMON_GROUPS}

		[grid]
			[row]
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								horizontal_alignment = "left"
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_TITLE}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_FILTER_BOX}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				grow_factor = 1
				[column]
					horizontal_grow = true
					vertical_grow = true
					border = "all"
					border_size = 5

					[panel]
						id = "campaign_background"
						definition = "campaign_menu_bg"

						[grid]
							[row]
								[column]
									grow_factor = 2
									horizontal_grow = true
									vertical_grow = true

									[grid]
										[row]
											[column]
												horizontal_grow = true
												border = "left,right,top"
												border_size = 5

												{_MOBILE_CAMPAIGN_HEADER}
											[/column]
										[/row]

										[row]
											grow_factor = 1
											[column]
												horizontal_grow = true
												vertical_grow = true
												border = "left,bottom,right"
												border_size = 5

												{_MOBILE_CAMPAIGN_TREE}
											[/column]
										[/row]
									[/grid]
								[/column]

								[column]
									grow_factor = 3
									horizontal_grow = true
									vertical_grow = true
									border = "all"
									border_size = 5

									{_MOBILE_CAMPAIGN_RIGHT_PANE}
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]

			# Options in one row.
			[row]
				[column]
					horizontal_grow = true

					[grid]
						[row]
							[column]
								horizontal_alignment = "left"
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_LABEL _"Modifications:"}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_MODS_MENU}
							[/column]
							[column]
								horizontal_alignment = "right"
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_LABEL _"Combat:"}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_RNG_MENU}
							[/column]
							[column]
								horizontal_alignment = "right"
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_LABEL _"Difficulty:"}
							[/column]
							[column]
								grow_factor = 1
								horizontal_grow = true
								border = "all"
								border_size = 5

								{_MOBILE_CAMPAIGN_DIFFICULTY_MENU}
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]

			[row]
				[column]
					horizontal_alignment = "right"

					{_MOBILE_CAMPAIGN_BUTTONS}
				[/column]
			[/row]
		[/grid]
	[/resolution]

[/window]

#undef _MOBILE_CAMPAIGN_LABEL
#undef _MOBILE_CAMPAIGN_COMMON_GROUPS
#undef _MOBILE_CAMPAIGN_BUTTONS
#undef _MOBILE_CAMPAIGN_MODS_MENU
#undef _MOBILE_CAMPAIGN_FILTER_BOX
#undef _MOBILE_CAMPAIGN_TITLE
#undef _MOBILE_CAMPAIGN_DIFFICULTY_MENU
#undef _MOBILE_CAMPAIGN_RNG_MENU
#undef _MOBILE_CAMPAIGN_HEADER
#undef _MOBILE_CAMPAIGN_RIGHT_PANE
#undef _MOBILE_CAMPAIGN_DESCRIPTION
#undef _MOBILE_CAMPAIGN_TREE
