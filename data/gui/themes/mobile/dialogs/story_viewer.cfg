#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): story screen for phones.
###
### Two layouts, picked by screen size (logical pixels, phone at pixel scale 2):
###   - portrait  (base resolution, about 540x1170): the story art fills the screen,
###     a tall text panel sits at the bottom, and Back / Skip / Next are a row of
###     touch-size buttons under the text. The default theme's two 128px arrows
###     would use 256 of the 540 pixels of width, so they are not used here.
###   - landscape (window 800x400 and up, about 1170x540): same layout as the default
###     theme (arrows at the sides of the text, Skip under it), with a taller text panel.
### Widget ids and the stacked_widget layer order (spacer, panel, controls) must stay
### as they are: src/gui/dialogs/story_viewer.cpp looks up text_and_control_stack,
### text_panel (in layer 0 of the stack's background layer grid), part_text, prev,
### next and cancel.
### The window definition "story_viewer_window" (black background) and the story_viewer_panel
### definition come from the default theme.
###

#define _MOBILE_STORY_PANEL_LAYER
		[layer]
			[row]
				grow_factor = 0
				[column]
					horizontal_grow = true
					vertical_grow = true

					[panel]
						id = "text_panel"
						definition = "story_viewer_panel"

						# This panel isn't meant to have any contents.
						# It simply serves as the background.
						[grid]
						[/grid]
					[/panel]
				[/column]
			[/row]
		[/layer]
#enddef

#define _MOBILE_STORY_TEXT
	[scroll_label]
		definition = "default"
		id = "part_text"
		horizontal_scrollbar_mode = "never"
		use_markup = true
	[/scroll_label]
#enddef

#
# Portrait: spacer sets the text panel height, text above a row of three buttons.
#
#define _MOBILE_STORY_STACK_PORTRAIT
	[stacked_widget]
		id = "text_and_control_stack"

		[layer]
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[spacer]
						definition = "default"
						height = "(max(260, screen_height / 3))"
					[/spacer]
				[/column]
			[/row]
		[/layer]

		{_MOBILE_STORY_PANEL_LAYER}

		[layer]
			[row]
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[grid]
						[row]
							grow_factor = 1
							[column]
								grow_factor = 1
								border = "all"
								border_size = 15
								horizontal_grow = true
								vertical_grow = true

								{_MOBILE_STORY_TEXT}
							[/column]
						[/row]

						[row]
							grow_factor = 0
							[column]
								horizontal_grow = true

								[grid]
									[row]
										grow_factor = 0

										[column]
											grow_factor = 1
											horizontal_grow = true
											border = "left,right,bottom"
											border_size = 15

											[button]
												id = "prev"
												definition = "default"
												label = _ "Back"
											[/button]
										[/column]

										[column]
											grow_factor = 1
											horizontal_grow = true
											border = "left,right,bottom"
											border_size = 15

											[button]
												id = "cancel"
												definition = "default"
												label = _ "Skip"
											[/button]
										[/column]

										[column]
											grow_factor = 1
											horizontal_grow = true
											border = "left,right,bottom"
											border_size = 15

											[button]
												id = "next"
												definition = "default"
												label = _ "Next"
											[/button]
										[/column]
									[/row]
								[/grid]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/layer]
	[/stacked_widget]
#enddef

#
# Landscape: arrows at the sides, text in the middle, Skip under the text.
#
#define _MOBILE_STORY_STACK_LANDSCAPE
	[stacked_widget]
		id = "text_and_control_stack"

		[layer]
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[spacer]
						definition = "default"
						height = "(max(170, screen_height / 3.5))"
					[/spacer]
				[/column]
			[/row]
		[/layer]

		{_MOBILE_STORY_PANEL_LAYER}

		[layer]
			[row]
				[column]
					grow_factor = 0
					horizontal_grow = true
					vertical_grow = true

					[grid]
						[row]
							grow_factor = 1
							[column]
								grow_factor = 0
								border = "all"
								border_size = 20
								horizontal_alignment = "center"
								vertical_alignment = "bottom"

								[button]
									id = "prev"
									definition = "left_arrow_story"
								[/button]
							[/column]
						[/row]

						[row]
							grow_factor = 0
							[column]
								[spacer]
									width = "((screen_width - min(screen_width / 1.5, 1000)) / 2)"
								[/spacer]
							[/column]
						[/row]
					[/grid]
				[/column]

				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_grow = true

					[grid]
						[row]
							grow_factor = 1
							[column]
								grow_factor = 1
								border = "all"
								border_size = 20
								horizontal_grow = true
								vertical_grow = true

								{_MOBILE_STORY_TEXT}
							[/column]
						[/row]

						[row]
							grow_factor = 0
							[column]
								border = "left,right,bottom"
								border_size = 20
								horizontal_alignment = "center"

								[button]
									id = "cancel"
									label = _ "Skip"
									definition = "header_story_skip"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]

				[column]
					grow_factor = 0
					horizontal_grow = true
					vertical_grow = true

					[grid]
						[row]
							grow_factor = 1
							[column]
								grow_factor = 0
								border = "all"
								border_size = 20
								horizontal_alignment = "center"
								vertical_alignment = "bottom"

								[button]
									id = "next"
									definition = "right_arrow_story"
								[/button]
							[/column]
						[/row]

						[row]
							grow_factor = 0
							[column]
								[spacer]
									width = "((screen_width - min(screen_width / 1.5, 1000)) / 2)"
								[/spacer]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/layer]
	[/stacked_widget]
#enddef

[window]
	id = "story_viewer"
	description = "Story screen browser (Wesnoth Mobile)."

	# Portrait (base resolution)
	[resolution]
		definition = "story_viewer_window"
		{GUI_WINDOW_FULLSCREEN}

		[tooltip]
			id = "tooltip_large"
		[/tooltip]

		[helptip]
			id = "tooltip_large"
		[/helptip]

		[grid]
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_alignment = "bottom"

					{_MOBILE_STORY_STACK_PORTRAIT}
				[/column]
			[/row]
		[/grid]
	[/resolution]

	# Landscape (800x400 and up)
	[resolution]
		window_width = 800
		window_height = 400
		definition = "story_viewer_window"
		{GUI_WINDOW_FULLSCREEN}

		[tooltip]
			id = "tooltip_large"
		[/tooltip]

		[helptip]
			id = "tooltip_large"
		[/helptip]

		[grid]
			[row]
				grow_factor = 1
				[column]
					grow_factor = 1
					horizontal_grow = true
					vertical_alignment = "bottom"

					{_MOBILE_STORY_STACK_LANDSCAPE}
				[/column]
			[/row]
		[/grid]
	[/resolution]

[/window]
