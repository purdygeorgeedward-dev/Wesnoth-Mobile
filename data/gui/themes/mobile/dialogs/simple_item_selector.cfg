#textdomain wesnoth-lib
###
### Wesnoth Mobile (2026-11-08): simple_item_selector for phones. A simple list chooser used by several in-game actions.
### Copy of the default theme's dialog with only the size rules changed: maximum_width capped to the screen (1); maximum_height capped to the screen (1).
### The default caps (up to 1200 wide and 600 to 750 tall) are larger than a 540 tall landscape screen
### or a 540 wide portrait screen. The new caps are the screen size minus 20 (at most 900 wide), so
### the same file fits both orientations. Widgets, ids and borders are unchanged.
###

###
### Definition of the window to select an addon for installation.
###

[window]
	id = "simple_item_selector"
	description = "Generic item selection dialog."

	[resolution]
		definition = "default"

		automatic_placement = true
		vertical_placement = "center"
		horizontal_placement = "center"

		maximum_width = "(min(screen_width - 20, 900))"
		maximum_height = "(screen_height - 20)"

		[linked_group]
			id = "item"
			fixed_width = true
		[/linked_group]

		[tooltip]
			id = "tooltip"
		[/tooltip]

		[helptip]
			id = "tooltip"
		[/helptip]

		[grid]

			[row]
				grow_factor = 0

				[column]
					grow_factor = 1

					border = "all"
					border_size = 5
					horizontal_alignment = "left"
					[label]
						id =  "title"
						definition = "title"
					[/label]

				[/column]

			[/row]

			[row]
				grow_factor = 0

				[column]
					grow_factor = 1

					border = "all"
					border_size = 5
					horizontal_alignment = "left"

					[scroll_label]
						id = "message"
						definition = "default"
					[/scroll_label]

				[/column]

			[/row]

			[row]
				grow_factor = 1

				[column]
					grow_factor = 1

					horizontal_grow = true
					vertical_grow = true

					border = "all"
					border_size = 5

					[listbox]
						id = "listbox"
						definition = "default"

						[list_definition]

							[row]

								[column]
									vertical_grow = true
									horizontal_grow = true
									[toggle_panel]
										definition = "default"
										return_value_id = "ok"
										[grid]
											[row]
												[column]
													grow_factor = 1
													horizontal_grow = true
													border = "all"
													border_size = 10
													[label]
														id = "item"
														definition = "default"
														linked_group = "item"
													[/label]
												[/column]
											[/row]
										[/grid]
									[/toggle_panel]
								[/column]

							[/row]

						[/list_definition]

					[/listbox]

				[/column]

			[/row]

			[row]
				grow_factor = 0

				[column]
					horizontal_alignment = "right"

					[grid]

						[row]
							grow_factor = 0

							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								[button]
									id = "ok"
									definition = "default"
									label = _ "OK"
								[/button]

							[/column]

							[column]
								border = "all"
								border_size = 5
								horizontal_alignment = "right"

								[button]
									id = "cancel"
									definition = "default"
									label = _ "Cancel"
								[/button]

							[/column]

						[/row]

					[/grid]

				[/column]

			[/row]

		[/grid]

	[/resolution]

[/window]
