#textdomain wesnoth-lib
###
### Wesnoth Mobile theme: phone-first, touch-friendly GUI (started 2026-10-31).
###
### Only widgets and dialogs that need to change for phones are defined here.
### Anything not defined in this theme falls back to the default (Parchment)
### theme automatically (src/gui/core/gui_definition.cpp).
###

[gui]
	id = "mobile"
# wmllint: markcheck off
	description = "Wesnoth Mobile"
# wmllint: markcheck on

	[settings]
		popup_show_delay = 350
		popup_show_time = 5000
		help_show_time = 0

		double_click_time = 500
		repeat_button_repeat_time = 350

		sound_button_click = "button.wav"
		sound_toggle_button_click = "checkbox.wav"
		sound_toggle_panel_click = "select.wav"
		sound_slider_adjust = "slider.wav"

		has_helptip_message = _" (Press ‘$hotkey’ for more information)"
	[/settings]

	{tips.cfg}

	{gui/themes/mobile/widgets/}
[/gui]
