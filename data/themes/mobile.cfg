#textdomain wesnoth

# wmlscope: set export=no

# Wesnoth Mobile (2026-11-08): the in-game theme for phones.
#
# Two layouts (the engine takes the FIRST [resolution] whose size fits the screen, so landscape is first):
#   landscape (screen at least 1000x480 logical pixels, about 1170x540 on the Galaxy A26 at pixel scale 2):
#     a 48 high top bar (menu, turn, gold, villages, units, upkeep, income, battery, time of day) and
#     a 60 high bottom bar (the selected unit's image, name, type, level, HP, XP and moves on the left;
#     Undo, Recruit, Actions and End Turn on the right). The map fills everything between.
#   portrait (screen at least 480x1000, about 540x1170): the same top bar (without upkeep, income and battery),
#     and two bottom bars: unit info, then Undo, Recruit, Actions and End Turn.
# Elements use plain coordinates and anchors, no references: a left or top anchored element stretches with the
# extra screen size, a right or bottom anchored one moves with it (see theme.cpp, theme::object::location).
# Buttons draw at the size of their image, so the button images are 96, 112 and 168 wide and 44 high (44 logical
# pixels is 88 on the A26): images/buttons/mobile/ is the stock large button resized by script.
# Not done yet: minimap on demand (there is no minimap element), the unit panel hide/show switch (themes cannot
# toggle; it needs C++), replay controls and the countdown timer (multiplayer and replays), terrain and
# position readouts. The art for the bars is placeholder flat tiles in data/core/images/themes/mobile/.

[theme]
    id=Mobile
    name= _ "theme^Wesnoth Mobile"
    description= _ "The Wesnoth Mobile theme, for phones"

    [resolution]
        id=landscape
        width=1000
        height=480

        [screen]
            id=screen
            rect="0,0,1000,480"
        [/screen]

        [panel]
            id=top-panel
            image=themes/mobile/top-bar.png
            ref=screen
            # rect="0,0,1000,48"  (2026-11-11 old rect)
            rect="0,0,1000,64"
            xanchor=left
            yanchor=fixed
        [/panel]
        [panel]
            id=bottom-bar
            image=themes/mobile/bottom-bar.png
            ref=screen
            # rect="0,420,1000,480"  (2026-11-11 old rect)
            rect="0,408,1000,480"
            xanchor=left
            yanchor=bottom
        [/panel]
        [main_map]
            id=main-map
            ref=screen
            # rect="0,48,1000,420"  (2026-11-11 old rect)
            rect="0,64,1000,408"
            xanchor=left
            yanchor=top
        [/main_map]
